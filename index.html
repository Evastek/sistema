let _rocketNodes=null;
function playRocketRoar() {
  try {
    const ac=getLUAudio(); const dest=_mkComp(ac);
    // 3 camadas de ruído texturizado — motor real é multi-frequência
    function mkLayer(loFreq,hiFreq,loopSec) {
      const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*loopSec),ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++){const t=i/ac.sampleRate; d[i]=(Math.random()*2-1)*(.7+Math.sin(t*3.1)*.3);}
      const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
      const lp=ac.createBiquadFilter(); lp.type='bandpass'; lp.frequency.value=(loFreq+hiFreq)/2; lp.Q.value=.6;
      return {src,lp};
    }
    const L1=mkLayer(60,200,7), L2=mkLayer(200,600,5.3), L3=mkLayer(800,2400,3.7);
    const masterG=ac.createGain(); masterG.gain.setValueAtTime(.01,ac.currentTime); masterG.gain.linearRampToValueAtTime(.42,ac.currentTime+2.2);
    const g1=ac.createGain(); g1.gain.value=1.1;
    const g2=ac.createGain(); g2.gain.value=.55;
    const g3=ac.createGain(); g3.gain.value=.22;
    L1.src.connect(L1.lp); L1.lp.connect(g1); g1.connect(masterG);
    L2.src.connect(L2.lp); L2.lp.connect(g2); g2.connect(masterG);
    L3.src.connect(L3.lp); L3.lp.connect(g3); g3.connect(masterG);
    masterG.connect(dest);
    L1.src.start(); L2.src.start(); L3.src.start();
    _rocketNodes={srcs:[L1.src,L2.src,L3.src],masterG,ac};
  } catch(e){}
}
function rocketRoarIntensify() {
  if(!_rocketNodes) return;
  try{const{masterG,ac}=_rocketNodes; masterG.gain.linearRampToValueAtTime(1.05,ac.currentTime+.9);}catch(e){}
}
function stopRocketRoar() {
  if(!_rocketNodes) return;
  try{const{srcs,masterG,ac}=_rocketNodes; masterG.gain.linearRampToValueAtTime(0,ac.currentTime+.4); setTimeout(()=>{srcs.forEach(s=>{try{s.stop();}catch(e){}});},500);}catch(e){}
  _rocketNodes=null;
}

// ── TRUQUE PSICOLÓGICO PRINCIPAL ────────────────────────────────────────────
// Fanfarra em progressão maior autêntica: C → G/B → Am → F → G → C
// Resolução harmônica = sinaliza CONCLUSÃO e ativa dopamina
// Vibrato leve nas notas longas = humaniza e cria emoção
// Percussão em off-beat = energia e dança
// 528Hz na cauda = "frequência de amor" (efeito reportado)
// ────────────────────────────────────────────────────────────────────────────
function playFanfare() {
  try {
    const ac=getLUAudio(); const dest=_mkComp(ac);
    const rev=_mkReverb(ac,1.8); if(rev) rev.connect(ac.destination);
    const rG=ac.createGain(); rG.gain.value=.32; if(rev) rG.connect(rev);

    function note(freq,t,dur,vol,type='sawtooth',vibHz=0,vibDepth=0) {
      const osc=ac.createOscillator(); osc.type=type; osc.frequency.value=freq;
      if(vibHz>0) {
        const vib=ac.createOscillator(); vib.type='sine'; vib.frequency.value=vibHz;
        const vg=ac.createGain(); vg.gain.value=freq*vibDepth;
        vib.connect(vg); vg.connect(osc.frequency);
        vib.start(t+.12); vib.stop(t+dur+.1);
      }
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(freq*4,t); lp.frequency.exponentialRampToValueAtTime(freq*1.5,t+dur*.8);
      const g=ac.createGain();
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.025);
      g.gain.setValueAtTime(vol,t+dur*.75); g.gain.exponentialRampToValueAtTime(.001,t+dur+.18);
      osc.connect(lp); lp.connect(g); g.connect(dest); g.connect(rG);
      osc.start(t); osc.stop(t+dur+.2);
    }

    function pad(freqs,t,dur,vol) {
      freqs.forEach(f=>{
        const osc=ac.createOscillator(); osc.type='sine'; osc.frequency.value=f;
        const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.5); g.gain.setValueAtTime(vol,t+dur-.3); g.gain.exponentialRampToValueAtTime(.001,t+dur+.1);
        osc.connect(g); g.connect(dest); if(rev){const rg=ac.createGain();rg.gain.value=.55;g.connect(rg);rg.connect(rev);}
        osc.start(t); osc.stop(t+dur+.2);
      });
    }

    function perc(t,vol=.14) {
      const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*.12),ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3.5);
      const src=ac.createBufferSource(); src.buffer=buf;
      const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4500;
      const g=ac.createGain(); g.gain.value=vol;
      src.connect(hp); hp.connect(g); g.connect(dest); src.start(t);
    }

    const T=ac.currentTime;

    // ── Melodia (lead) — trompete sintético ──
    note(523.25,T+0,   .22,.24,'sawtooth');  // C5
    note(523.25,T+.10, .10,.14,'sawtooth');  // C5 staccato
    note(659.25,T+.28, .25,.26,'sawtooth');  // E5
    note(783.99,T+.57, .28,.28,'sawtooth');  // G5
    note(1046.5, T+.90, .62,.34,'sawtooth',5.5,.006); // C6 — CLIMAX com vibrato!
    note(880,    T+1.56,.20,.22,'sawtooth');  // A5 descida
    note(1046.5, T+1.78,.95,.32,'sawtooth',5.8,.005); // C6 — resolução total

    // ── Harmonia (pads de cordas) ──
    pad([261.63,329.63,392.00],         T+.05,  1.1, .055); // C3/E3/G3
    pad([246.94,311.13,392.00,493.88],  T+1.2,  1.5, .05 ); // B2/Eb3/G3/B3 → G/B
    pad([261.63,329.63,392.00,523.25],  T+2.7,  1.2, .055); // C major final

    // ── Baixo — ancora tonalidade ──
    note(130.81,T+0,  .9, .18,'sine'); // C2
    note(146.83,T+.9, .7, .16,'sine'); // D2
    note(130.81,T+1.8,.95,.18,'sine'); // C2 resolve

    // ── Percussão — hi-hats em off-beat criam energia ──
    [0,.28,.57,.85,1.14,1.42,1.71,2.0,2.28,2.57].forEach((dt,i)=>perc(T+dt,.10+.04*(i%3)));

    // ── TRUQUE FINAL: 528Hz "frequência de harmonia" + harmônico ──
    // Aparece suavemente aos 2s, mantém sensação de bem-estar
    setTimeout(()=>{
      try {
        [528,1056,1584].forEach((f,i)=>{
          const osc=ac.createOscillator(); osc.type='sine'; osc.frequency.value=f;
          const g=ac.createGain(); const vol=.07/(i+1);
          g.gain.setValueAtTime(0,ac.currentTime); g.gain.linearRampToValueAtTime(vol,ac.currentTime+.8);
          g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+4.5);
          osc.connect(g); g.connect(dest); if(rev){const rg=ac.createGain();rg.gain.value=.6;g.connect(rg);rg.connect(rev);}
          osc.start(); osc.stop(ac.currentTime+4.6);
        });
      } catch(e){}
    },1800);
  } catch(e){}
}

function playAnticipationRise() {

      osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t+.25);

    const g2=ac.createGain(); g2.gain.value=1;

  } catch(e){}
}

    const MAX_FIRE = 90, MAX_SMOKE = 40;

    function spawnParticles(x, y, speed, intense) {
      const fc = intense ? 7 : 3;
      for (let i = 0; i < fc && firePool.length < MAX_FIRE; i++) {
        firePool.push({
          x: x + (Math.random()-0.5)*(intense?22:10),
          y: y + Math.random()*5,
          vx: (Math.random()-0.5)*(intense?2.2:1.1),
          vy: speed*0.2 + Math.random()*(intense?5.5:2.8) + 1.0,
          size: PT * (Math.random()*0.5 + (intense?0.32:0.2)),
          life: 1,
          decay: 0.03 + Math.random()*0.022,
        });
      }
      if (Math.random() < 0.4 && smokePool.length < MAX_SMOKE) {
        smokePool.push({
          x: x+(Math.random()-0.5)*24, y: y+10,
          vx: (Math.random()-0.5)*0.5, vy: Math.random()*1.2+0.5,
          size: ST*(Math.random()*0.5+0.3), life:1,
          decay: 0.008+Math.random()*0.006,
        });
      }
    }

    // ── Loop de animação otimizado — sem gradiente por partícula ──
    const TOTAL_FRAMES = 220;
    let rFrame = 0, rAnim;

    function animateRocket() {
      const t = rFrame / TOTAL_FRAMES;

      // Easing: lento→explosivo (sem "parado demais")
      let eased;
      if (t < 0.45) {
        eased = t * t * 0.32;
      } else {
        const t2 = (t - 0.45) / 0.55;
        eased = 0.32 + t2 * t2 * t2 * 0.68;
      }

      const totalDist = rc.height + 230;
      ry = (rc.height + 160) - eased * totalDist;

      const speed   = 1.5 + eased * 18;
      const intense = t > 0.45;
      const scale   = 0.82 + eased * 0.38;
      const motorY  = ry + 64 * scale;

      spawnParticles(cx, motorY, speed, intense);

      rctx.clearRect(0, 0, rc.width, rc.height);

      // ── Estrelas passando para trás (efeito warp speed) ──
      drawStarStreaks(eased);

      // ── Vinheta de velocidade nas bordas (efeito túnel) ──
      if (eased > 0.35) {
        const vigIntensity = Math.min(0.72, (eased - 0.35) * 1.6);
        const vigGrad = rctx.createRadialGradient(cx, rc.height * 0.5, rc.height * 0.15, cx, rc.height * 0.5, rc.height * 0.95);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vigGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
        vigGrad.addColorStop(1, `rgba(5,8,18,${vigIntensity})`);
        rctx.fillStyle = vigGrad;
        rctx.fillRect(0, 0, rc.width, rc.height);
      }

      // ── Fumaça (detrás de tudo, blending normal) ──
      for (let i = smokePool.length-1; i >= 0; i--) {
        const p = smokePool[i];
        p.x += p.vx; p.y += p.vy; p.size += 0.4; p.life -= p.decay;
        if (p.life <= 0) { smokePool.splice(i,1); continue; }
        rctx.globalAlpha = p.life * 0.22;
        rctx.drawImage(stex, p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      }
      rctx.globalAlpha = 1;

      // ── Fogo — additive blending: cores somam, sem necessidade de gradiente por partícula ──
      rctx.save();
      rctx.globalCompositeOperation = 'lighter';
      for (let i = firePool.length-1; i >= 0; i--) {
        const p = firePool[i];
        p.vx *= 0.97; p.x += p.vx;
        p.vy += 0.11;  p.y += p.vy;
        p.size *= 0.97; p.life -= p.decay;
        if (p.life <= 0 || p.size < 2) { firePool.splice(i,1); continue; }
        rctx.globalAlpha = Math.min(p.life * 0.72, 0.68);
        rctx.drawImage(ptex, p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      }
      rctx.restore();

      // ── Halo do motor — UM gradiente por frame (barato) ──
      if (ry < rc.height + 110) {
        rctx.save();
        rctx.globalCompositeOperation = 'lighter';
        const gr = (30 + eased * 28) * scale;
        const gg = rctx.createRadialGradient(cx, motorY, 0, cx, motorY, gr);
        const gi = 0.38 + eased * 0.38;
        gg.addColorStop(0,   `rgba(255,248,140,${Math.min(1,gi)})`);
        gg.addColorStop(0.38,`rgba(255,110,20,${gi*0.5})`);
        gg.addColorStop(1,   'rgba(255,30,0,0)');
        rctx.fillStyle = gg;
        rctx.beginPath(); rctx.arc(cx, motorY, gr, 0, Math.PI*2); rctx.fill();
        rctx.restore();
      }

      // ── Foguete: drawImage do offscreen (zero re-draw do shape) ──
      if (ry < rc.height + 120 && ry > -340) {
        const drawW = ROFF_W * (scale / RS);
        const drawH = ROFF_H * (scale / RS);
        rctx.drawImage(roff, cx - drawW/2, ry - drawH * 0.5, drawW, drawH);
      }

      // Shake do backdrop na aceleração final
      if (t > 0.45) {
        const amt = (t - 0.45) * 14;
        backdrop.style.transform = `translate(${(Math.random()-0.5)*amt}px,${(Math.random()-0.5)*amt*0.35}px)`;
      }

      if (rFrame === Math.floor(TOTAL_FRAMES * 0.45)) {
        rocketRoarIntensify();
        playWhoosh();
      }

      rFrame++;
      if (rFrame <= TOTAL_FRAMES && ry > -290) {
        rAnim = requestAnimationFrame(animateRocket);
      } else {
        cancelAnimationFrame(rAnim);
        backdrop.style.transform = '';
        stopRocketRoar();
        rocketPhase.style.display = 'none';
        rocketPhase.classList.remove('active');
        triggerExplosion();
      }
    }
    rAnim = requestAnimationFrame(animateRocket);

    // ─── FASE 2: Explosão ───
    function triggerExplosion() {
      playBoom();
      const explosionPhase = document.getElementById('lu-explosion-phase');
      const expCanvas      = document.getElementById('lu-explosion-canvas');
      explosionPhase.classList.add('active');
      expCanvas.width  = window.innerWidth;
      expCanvas.height = window.innerHeight;
      const ctx = expCanvas.getContext('2d');
      const ecx = expCanvas.width / 2;
      const ecy = expCanvas.height / 2;

      const expColors = [color,'#fff','#ffd700','#ff8c00','#ff4500',color+'cc','#a78bfa','#2ecc8f'];
      const sparks=[], debris=[], embers=[];

      for (let i=0;i<300;i++) {
        const a=Math.random()*Math.PI*2, sp=Math.random()*26+3;
        sparks.push({ x:ecx,y:ecy, vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
          r:Math.random()*5+1.2, color:expColors[Math.floor(Math.random()*expColors.length)],
          life:1, decay:Math.random()*.024+.014, gravity:Math.random()*.38+.1,
          drag:Math.random()*.022+.008, shape:Math.random()>.5?'rect':'circle',
          rot:Math.random()*Math.PI*2, rotS:(Math.random()-.5)*.32 });
      }
      for (let i=0;i<45;i++) {
        const a=Math.random()*Math.PI*2, sp=Math.random()*11+2;
        debris.push({ x:ecx,y:ecy, vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
          w:Math.random()*13+5, h:Math.random()*4+2,
          color:['#78909c','#b0bec5','#c0392b','#e8edf5'][Math.floor(Math.random()*4)],
          life:1, decay:Math.random()*.01+.007, gravity:.2, drag:.014,
          rot:Math.random()*Math.PI*2, rotS:(Math.random()-.5)*.14 });
      }
      for (let i=0;i<90;i++) {
        const a=Math.random()*Math.PI*2, sp=Math.random()*5.5+.5;
        embers.push({ x:ecx+(Math.random()-.5)*50,y:ecy+(Math.random()-.5)*50,
          vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
          r:Math.random()*3.2+1, life:1, decay:Math.random()*.007+.003,
          gravity:.035, flicker:Math.random()*Math.PI*2 });
      }

      const rings = [
        {r:0,opacity:1.0,speed:30,color:'#fff',lw:5},
        {r:0,opacity:.85,speed:20,color:color,lw:3.5},
        {r:0,opacity:.65,speed:13,color:'#ffd700',lw:2.5},
        {r:0,opacity:.45,speed:7, color:color,lw:1.5},
      ];

      let expFrame=0;
      function drawExplosion() {
        ctx.clearRect(0,0,expCanvas.width,expCanvas.height);

        // Flash branco inicial
        if (expFrame < 10) {
          const fa = Math.max(0, .9 - expFrame*.09);
          ctx.fillStyle=`rgba(255,255,255,${fa})`;
          ctx.fillRect(0,0,expCanvas.width,expCanvas.height);
        }

        // Shockwaves
        rings.forEach(ring => {
          ring.r += ring.speed; ring.opacity -= .016; ring.speed *= .9;
          if (ring.opacity>0) {
            ctx.beginPath(); ctx.arc(ecx,ecy,ring.r,0,Math.PI*2);
            ctx.strokeStyle=ring.color; ctx.lineWidth=ring.lw;
            ctx.globalAlpha=Math.max(0,ring.opacity); ctx.stroke(); ctx.globalAlpha=1;
          }
        });

        // Brasas
        embers.forEach(p => {
          p.x+=p.vx; p.y+=p.vy; p.vx*=.996; p.vy+=p.gravity;
          p.life-=p.decay; p.flicker+=.28;
          if (p.life<=0) return;
          const fa=(Math.sin(p.flicker)*.3+.7)*p.life;
          ctx.fillStyle=`rgba(255,${Math.floor(110*p.life)},0,${Math.min(1,fa)})`;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
        });

        // Detritos
        debris.forEach(p => {
          p.vx*=(1-p.drag); p.vy*=(1-p.drag); p.vy+=p.gravity;
          p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotS;
          if (expFrame>18) p.life-=p.decay;
          if (p.life<=0) return;
          ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
          ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
        });

        // Faíscas
        sparks.forEach(p => {
          p.vx*=(1-p.drag); p.vy*=(1-p.drag); p.vy+=p.gravity;
          p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotS;
          if (expFrame>14) p.life-=p.decay;
          if (p.life<=0) return;
          ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
          ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          if (p.shape==='rect') ctx.fillRect(-p.r,-p.r/2.5,p.r*2,p.r/2.5);
          else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
          ctx.restore();
        });

        expFrame++;
        if (expFrame<120) requestAnimationFrame(drawExplosion);
        else {
          explosionPhase.classList.remove('active');
          showLevelUpMainCard(oldLevel,newLevel,color,phrase);
        }
      }
      drawExplosion();
    } // end triggerExplosion

  }, 2100); // delay após fase de antecipação sonora (~1.8s)
}

function showLevelUpMainCard(oldLevel, newLevel, color, phrase) {
  const mainPhase = document.getElementById('lu-main-phase');
  const bgCanvas  = document.getElementById('lu-bg-canvas');
  mainPhase.classList.add('active');

  bgCanvas.width  = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  const ctx = bgCanvas.getContext('2d');

  // ── Background animado: gradiente giratório + orb pulsante + estrelas cadentes ──
  let bgAngle = 0, bgAnim, bgFrame = 0;
  const stars = Array.from({length:200}, () => ({
    x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height,
    r: Math.random()*2.2+.2, pulse: Math.random()*Math.PI*2,
    speed: Math.random()*.055+.01,
    // Algumas estrelas são shooting stars
    isShooting: Math.random()>.88,
    sx: Math.random()*bgCanvas.width, sy: Math.random()*bgCanvas.height*.4,
    svx: Math.random()*4+2, svy: Math.random()*1.5+.5, sLife:0, sDur: Math.floor(Math.random()*60)+30,
    sDelay: Math.floor(Math.random()*300),
  }));

  function drawBg() {
    bgAngle += .0035; bgFrame++;
    // Fundo com gradiente girando levemente
    const gx1=bgCanvas.width/2+Math.cos(bgAngle)*bgCanvas.width*.75;
    const gy1=bgCanvas.height/2+Math.sin(bgAngle)*bgCanvas.height*.75;
    const gx2=bgCanvas.width/2-Math.cos(bgAngle)*bgCanvas.width*.75;
    const gy2=bgCanvas.height/2-Math.sin(bgAngle)*bgCanvas.height*.75;
    const grad=ctx.createLinearGradient(gx1,gy1,gx2,gy2);
    grad.addColorStop(0,'#010306');
    grad.addColorStop(.28,color+'18');
    grad.addColorStop(.6,'#03070e');
    grad.addColorStop(1,color+'0b');
    ctx.fillStyle=grad; ctx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

    // Orb central respirando (truque: respiração sincronizada com música)
    const breathe = Math.sin(bgFrame*.022)*.5+.5;
    const orbR = bgCanvas.width*.48 + breathe*bgCanvas.width*.04;
    const orb=ctx.createRadialGradient(bgCanvas.width/2,bgCanvas.height/2,0,bgCanvas.width/2,bgCanvas.height/2,orbR);
    const orbAlpha = (0.18+breathe*.10).toFixed(2);
    orb.addColorStop(0,color+Math.round(parseFloat(orbAlpha)*255).toString(16).padStart(2,'0'));
    orb.addColorStop(.45,color+'0a');
    orb.addColorStop(1,'transparent');
    ctx.fillStyle=orb; ctx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

    // Anel de luz pulsante ao redor do orb
    const ringAlpha=(Math.sin(bgFrame*.04)*.3+.35)*(Math.min(bgFrame,60)/60);
    ctx.beginPath(); ctx.arc(bgCanvas.width/2,bgCanvas.height/2,bgCanvas.width*.22+breathe*bgCanvas.width*.015,0,Math.PI*2);
    ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.globalAlpha=ringAlpha*0.4; ctx.stroke(); ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(bgCanvas.width/2,bgCanvas.height/2,bgCanvas.width*.28+breathe*bgCanvas.width*.01,0,Math.PI*2);
    ctx.lineWidth=.6; ctx.globalAlpha=ringAlpha*0.2; ctx.stroke(); ctx.globalAlpha=1;

    // Estrelas normais + shooting stars
    stars.forEach(st => {
      if (st.isShooting) {
        if (bgFrame >= st.sDelay) {
          st.sLife++;
          if (st.sLife > st.sDur) { st.sLife=0; st.sx=Math.random()*bgCanvas.width*.7; st.sy=Math.random()*bgCanvas.height*.35; st.sDelay=bgFrame+Math.floor(Math.random()*120)+40; }
          if (st.sLife > 0 && st.sLife <= st.sDur) {
            const sa=Math.max(0,1-st.sLife/st.sDur);
            ctx.save(); ctx.globalAlpha=sa*.85;
            const tailLen=Math.min(st.sLife*2.5,60);
            const grad2=ctx.createLinearGradient(st.sx+st.svx*st.sLife,st.sy+st.svy*st.sLife,st.sx+st.svx*st.sLife-tailLen,st.sy+st.svy*st.sLife-tailLen*.4);
            grad2.addColorStop(0,'rgba(255,255,255,0.9)'); grad2.addColorStop(1,'rgba(255,255,255,0)');
            ctx.strokeStyle=grad2; ctx.lineWidth=1.8;
            ctx.beginPath(); ctx.moveTo(st.sx+st.svx*st.sLife,st.sy+st.svy*st.sLife); ctx.lineTo(st.sx+st.svx*st.sLife-tailLen,st.sy+st.svy*st.sLife-tailLen*.4); ctx.stroke();
            ctx.restore();
          }
        }
        return;
      }
      st.pulse+=st.speed;
      const a=(Math.sin(st.pulse)*.38+.62)*.8;
      ctx.fillStyle=`rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
    });

    bgAnim = requestAnimationFrame(drawBg);
  }
  drawBg();

  startConfetti(color);
  setTimeout(() => playFanfare(), 200);

  // ── Preenche conteúdo ──
  document.getElementById('lu-year-tag').textContent = '✦  EVASTEK PLATFORM  ✦';
  document.getElementById('lu-year-tag').style.color = color;

  const numEl = document.getElementById('lu-level-num');
  numEl.style.color = color;
  numEl.style.textShadow = `0 0 80px ${color}cc, 0 0 160px ${color}55`;

  document.getElementById('lu-level-name').textContent = levelName(newLevel);
  document.getElementById('lu-level-name').style.color = '#fff';

  document.getElementById('lu-phrase').textContent = phrase.replace(/^[^\s]+\s/,'');
  document.getElementById('lu-phrase').style.color = 'rgba(255,255,255,.83)';

  const perkList = LEVEL_PERKS[newLevel] || [];
  document.getElementById('lu-perks-row').innerHTML = perkList.map(p =>
    `<span style="background:${color}20;border:1px solid ${color}55;border-radius:20px;padding:9px 20px;font-size:.78rem;font-weight:600;color:#fff;letter-spacing:.06em;display:inline-block;transition:transform .3s ease;"
      onmouseover="this.style.transform='scale(1.07)'" onmouseout="this.style.transform='scale(1)'">${p}</span>`
  ).join('');

  const fb = document.getElementById('lu-from-badge');
  fb.textContent = `Nível ${oldLevel} — ${levelName(oldLevel)}  →  Nível ${newLevel}`;
  fb.style.cssText += `;background:${levelColor(oldLevel)}14;border:1px solid ${levelColor(oldLevel)}3e;color:${levelColor(oldLevel)};`;

  document.getElementById('lu-main-btn').textContent = '🚀 Explorar o Nível '+newLevel;
  document.getElementById('lu-main-btn').style.background = color;
  // Shimmer no botão — truque: movimento chama atenção para CTA
  document.getElementById('lu-main-btn').style.cssText +=
    ';position:relative;overflow:hidden;box-shadow:0 0 24px '+color+'88;';

  mainPhase._stopBg = () => cancelAnimationFrame(bgAnim);

  // ── Reveal cinematográfico — um elemento por vez com ping e pausa dramática ──
  const revealed = [
    { id:'lu-year-tag',   delay: 280,  freq: 660,  from:'bottom' },
    { id:'lu-level-num',  delay: 950,  freq: 880,  from:'scale'  }, // CLIMAX — com contador
    { id:'lu-level-name', delay: 2200, freq: 1100, from:'bottom' },
    { id:'lu-phrase',     delay: 3100, freq: 780,  from:'bottom' },
    { id:'lu-perks-row',  delay: 4000, freq: 920,  from:'bottom' },
    { id:'lu-from-badge', delay: 4800, freq: 740,  from:'bottom' },
    { query:'#lu-content > div:last-child', delay:5500, freq:1000, from:'bottom' },
  ];

  const content = document.getElementById('lu-content');
  content.style.opacity = '1'; content.style.transform = 'translateY(0)';

  revealed.forEach(item => {
    const el = item.id ? document.getElementById(item.id) : document.querySelector(item.query);
    if (!el) return;
    el.style.opacity='0';
    el.style.transform = item.from==='scale' ? 'scale(0.2) rotate(-8deg)' : 'translateY(40px)';
    el.style.transition='none';
  });

  revealed.forEach(item => {
    setTimeout(() => {
      const el = item.id ? document.getElementById(item.id) : document.querySelector(item.query);
      if (!el) return;

      if (item.id === 'lu-level-num') {
        // ── NÚMERO: contador dramático 00→0N + aberração cromática ──
        playPing(item.freq);
        el.style.transition = 'opacity .3s ease, transform .5s cubic-bezier(0.34,2.2,0.64,1)';
        el.style.opacity='1'; el.style.transform='scale(1) rotate(0deg)';

        // Conta de 0 até newLevel em velocidade acelerada
        let count = 0; const totalSteps = 12;
        const countInterval = setInterval(() => {
          count++;
          const display = count < totalSteps ? Math.floor((count/totalSteps)*newLevel*10)%10 : newLevel;
          el.textContent = '0' + (count < totalSteps ? Math.floor(Math.random()*9+1) : newLevel);
          if (count >= totalSteps) {
            clearInterval(countInterval);
            el.textContent = '0'+newLevel;
            // Flash final: cromático (tela divide em R/G/B brevemente)
            const flashDiv=document.createElement('div');
            flashDiv.style.cssText='position:fixed;inset:0;z-index:99999;pointer-events:none;background:'+color+';opacity:0;transition:opacity .06s linear;';
            document.body.appendChild(flashDiv);
            flashDiv.offsetWidth; flashDiv.style.opacity='.32';
            setTimeout(()=>{ flashDiv.style.opacity='0'; setTimeout(()=>flashDiv.remove(),150); },65);
            // Pulsa com glow máximo
            el.style.transition='transform .18s ease, text-shadow .18s ease';
            el.style.transform='scale(1.22) rotate(0deg)';
            el.style.textShadow=`0 0 120px ${color}, 0 0 240px ${color}bb, 0 0 60px #fff, 0 0 8px #fff`;
            playPing(item.freq*1.5);
            setTimeout(()=>{
              el.style.transform='scale(1)';
              el.style.textShadow=`0 0 80px ${color}cc, 0 0 160px ${color}55`;
            }, 280);
          }
        }, 55);
      } else {
        playPing(item.freq);
        el.style.transition = 'opacity .5s ease, transform .65s cubic-bezier(0.34,1.56,0.64,1)';
        el.style.opacity='1'; el.style.transform='scale(1) translateY(0)';
      }
    }, item.delay);
  });
}

function closeLevelUp() {
  const overlay   = document.getElementById('levelup-overlay');
  const mainPhase = document.getElementById('lu-main-phase');
  const content   = document.getElementById('lu-content');

  if (content) {
    content.style.transition='opacity .5s ease, transform .5s ease';
    content.style.opacity='0'; content.style.transform='translateY(40px)';
  }
  if (mainPhase && mainPhase._stopBg) mainPhase._stopBg();

  document.getElementById('levelup-backdrop').style.opacity='0';
  stopConfetti(); stopRocketRoar();

  setTimeout(()=>{
    overlay.classList.remove('active');
    ['lu-rocket-phase','lu-explosion-phase'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.classList.remove('active');el.style.display='none';}
    });
    mainPhase.classList.remove('active');
    const cur=currentPage;
    document.getElementById('main-content').innerHTML=buildClientDashboard()+buildClientProgress()+buildClientServices()+buildClientInvestment()+buildClientRanking()+buildClientChat()+buildClientGuide();
    navigateTo(cur==='client-progress'?'client-progress':'client-dashboard');
    _chatContainers[currentUser.level]='chat-messages-client';
    renderChatMessages(currentUser.level);
    // Revela sidebar e conteúdo agora que a animação terminou
    const mc = document.getElementById('main-content');
    const sb = document.getElementById('sidebar');
    if (mc) mc.style.visibility = '';
    if (sb) sb.style.visibility = '';
  }, 600);
}

// ── CONFETTI ──
let _confettiAnim = null;
let _confettiParticles = [];

function startConfetti(accentColor) {
  const canvas = document.getElementById('confetti-canvas');
  canvas.classList.add('active');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = [accentColor,'#fff','#fbbf24','#f8f9fa',accentColor+'cc','#a78bfa','#2ecc8f','#60a5fa','#f472b6','#fb923c'];

  // Formas: retângulo, círculo, estrela de 5 pontas, diamante
  function drawShape(ctx, p) {
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.opacity);
    ctx.fillStyle=p.color;
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rotation);
    if (p.shape==='rect') {
      ctx.fillRect(-p.r,-p.r/2.5,p.r*2,p.r); // ribbon
    } else if (p.shape==='circle') {
      ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    } else if (p.shape==='star') {
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=i*Math.PI*2/5-Math.PI/2;
        const a2=a+Math.PI/5;
        ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
        ctx.lineTo(Math.cos(a2)*p.r*.45,Math.sin(a2)*p.r*.45);
      }
      ctx.closePath(); ctx.fill();
    } else if (p.shape==='diamond') {
      ctx.beginPath();
      ctx.moveTo(0,-p.r); ctx.lineTo(p.r*.55,0); ctx.lineTo(0,p.r); ctx.lineTo(-p.r*.55,0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  _confettiParticles = Array.from({length: 200}, () => {
    const shapes=['rect','rect','circle','star','diamond'];
    return {
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height - canvas.height,
      r: Math.random()*7+3,
      d: Math.random()*140+10,
      color: colors[Math.floor(Math.random()*colors.length)],
      tiltAngle:0,
      tiltAngleInc: Math.random()*.08+.04,
      shape: shapes[Math.floor(Math.random()*shapes.length)],
      rotation: Math.random()*Math.PI*2,
      rotationSpeed: (Math.random()-.5)*.18,
      vx: (Math.random()-.5)*2.5,
      vy: Math.random()*3.5+1.5,
      opacity:1,
      fade: Math.random()*.005+.001,
    };
  });

  let frame=0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    _confettiParticles.forEach(p => {
      drawShape(ctx,p);
      p.tiltAngle+=p.tiltAngleInc;
      p.x+=p.vx+Math.sin(frame*.008+p.d)*.7;
      p.y+=p.vy;
      p.rotation+=p.rotationSpeed;
      if(frame>200) p.opacity-=p.fade;
      if(p.y>canvas.height+20||p.opacity<=0){
        p.y=-10; p.x=Math.random()*canvas.width;
        p.opacity=frame>200?0:1;
      }
    });
    frame++;
    if(frame<400||_confettiParticles.some(p=>p.opacity>0)){
      _confettiAnim=requestAnimationFrame(draw);
    } else { stopConfetti(); }
  }
  if(_confettiAnim) cancelAnimationFrame(_confettiAnim);
  draw();
}

function stopConfetti() {
  if (_confettiAnim) { cancelAnimationFrame(_confettiAnim); _confettiAnim = null; }
  const canvas = document.getElementById('confetti-canvas');
  if (canvas) { canvas.classList.remove('active'); canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); }
}

function toggleTask(uid, tid) {
  const user=DB.users.find(u=>u.id===uid); if(!user) return;
  const task=user.tasks.find(t=>t.id===tid); if(!task) return;
  task.done=!task.done;
  const oldLevel = user.level;
  recalcUser(user);
  showNotif(task.done?'+'+task.points+' pts! Tarefa concluída!':'Tarefa desmarcada', task.done?'success':'error');

  // Check for auto level up (100% + not max level)
  const shouldLevelUp = task.done && user.progress >= 100 && user.level < 4;

  if (shouldLevelUp) {
    user.level = oldLevel + 1;
    user.tasks = [];  // Admin will assign new tasks for the new level
    user.progress = 0;
    user.points = 0;
  }

  fbPatchUser(uid,{tasks:user.tasks,points:user.points,progress:user.progress,level:user.level}).catch(e=>{showNotif('Erro ao salvar tarefa: '+e.message,'error');});

  if (currentUser.id===uid) {
    currentUser.tasks=user.tasks; currentUser.points=user.points;
    currentUser.progress=user.progress; currentUser.level=user.level;
  }

  if (shouldLevelUp) {
    // Rebuild the shell navigation (sidebar now shows new level)
    const sbRole = document.getElementById('sb-role');
    if (sbRole) sbRole.textContent = 'Nível ' + user.level + ' — ' + levelName(user.level);
    // Show celebration FIRST, then rebuild on close
    showLevelUpCelebration(oldLevel, user.level);
  } else {
    const cur=currentPage;
    document.getElementById('main-content').innerHTML=buildClientDashboard()+buildClientProgress()+buildClientServices()+buildClientInvestment()+buildClientRanking()+buildClientChat()+buildClientGuide();
    navigateTo(cur);
    // Update container ref after rebuild
    _chatContainers[user.level] = 'chat-messages-client';
    renderChatMessages(user.level);
  }
}

let _pendingPhotoBase64 = null;

function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    const err = document.getElementById('photo-err');
    if (err) { err.textContent = 'Imagem muito grande. Máximo 2MB.'; err.style.display = 'block'; }
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    _pendingPhotoBase64 = ev.target.result;
    const prev = document.getElementById('photo-preview');
    if (prev) prev.innerHTML = '<img src="'+_pendingPhotoBase64+'" style="width:100%;height:100%;object-fit:cover;">';
    const btn = document.getElementById('save-photo-btn');
    if (btn) btn.disabled = false;
    const err = document.getElementById('photo-err');
    if (err) err.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function savePhoto() {
  if (!_pendingPhotoBase64) return;
  currentUser.photoUrl = _pendingPhotoBase64;

  _pendingPhotoBase64 = null;

  showNotif('Foto de perfil atualizada!', 'success');
}

function pinMsg(docId, level) {
  const isAdmin = currentUser && currentUser.role === 'admin';
  if (!isAdmin) return;
  // Unpin all others in this level first
  const msgs = DB.messages[level] || [];
  msgs.forEach(m => {
    if (m.pinned && m.docId && m.docId !== docId) {
      m.pinned = false;
      _db.collection('messages').doc(m.docId).update({ pinned: false }).catch(()=>{});
    }
  });
  const target = msgs.find(m => m.docId === docId);
  if (!target) return;
  const newPinned = !target.pinned;
  target.pinned = newPinned;
  _db.collection('messages').doc(docId).update({ pinned: newPinned }).catch(()=>{});
  // UI will update via onSnapshot
}

function renderPinnedBanner(level, containerId) {
  const msgs = DB.messages[level] || [];
  const pinned = msgs.find(m => m.pinned);
  const bannerId = 'pinned-banner-' + containerId;
  const existing = document.getElementById(bannerId);
  if (!pinned) { if (existing) existing.remove(); return; }
  const text = (pinned.text || '').length > 80 ? pinned.text.substring(0, 80) + '…' : pinned.text;
  const canUnpin = currentUser && currentUser.role === 'admin';
  const html = `<div class="pinned-banner" id="${bannerId}" onclick="scrollToPinned('${containerId}','${pinned.docId||''}')">
    <div class="pinned-banner-icon">📌</div>
    <div class="pinned-banner-body">
      <div class="pinned-banner-label">Mensagem fixada — ${pinned.name}</div>
      <div class="pinned-banner-text">${text}</div>
    </div>
    ${canUnpin ? `<button class="pinned-banner-close" title="Desafixar" onclick="event.stopPropagation();pinMsg('${pinned.docId}',${level})">✕</button>` : ''}
  </div>`;
  const container = document.getElementById(containerId);
  if (!container) return;
  if (existing) { existing.outerHTML = html; }
  else { container.insertAdjacentHTML('beforebegin', html); }
}

function scrollToPinned(containerId, docId) {
  const container = document.getElementById(containerId);
  if (!container || !docId) return;
  const msg = container.querySelector('[data-docid="' + docId + '"]');
  if (msg) { msg.scrollIntoView({ behavior: 'smooth', block: 'center' }); msg.style.transition='background 0.4s'; msg.style.background='rgba(240,165,0,0.12)'; setTimeout(()=>msg.style.background='',1200); }

function showMsgContextMenu(docId, name, text, el) {
  document.querySelectorAll('.msg-ctx-menu').forEach(e => e.remove());

  const isAdmin = currentUser && currentUser.role === 'admin';

  let html = '<button onclick="setReply(\'' + docId.replace(/'/g,"\\'") + '\',\'' + name.replace(/'/g,"\\'") + '\',\'' + text.replace(/'/g,"\\'").replace(/\n/g,' ') + '\');document.querySelectorAll(\'.msg-ctx-menu\').forEach(e=>e.remove())">↩ Responder</button>';

    html += '<button onclick="pinMsg(\'' + docId + '\',' + level + ');document.querySelectorAll(\'.msg-ctx-menu\').forEach(e=>e.remove())">' + (isPinned ? '📌 Desafixar' : '📌 Fixar mensagem') + '</button>';

function sendMsg(type) {
  const u = currentUser;
  const input = document.getElementById('chat-input-' + type);
  const text = input.value.trim();
  if (!text) return;

  const now = new Date();
  const time = now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();
  const level = type === 'admin' ? currentAdminChatLevel : u.level;
  const msg = { uid:u.id, name:u.name, avatar:u.avatar, color:u.color, role:u.role, text, time, level };
  if (u.photoUrl) msg.photoUrl = u.photoUrl;
  if (u.superadmin) msg.superadmin = true;
  if (_replyTo) { msg.replyTo = _replyTo; }

  // Clear input immediately for snappy UX
  input.value = '';
  input.focus();
  fbSetTyping(level, false);
  clearTimeout(_typingTimeouts[level]);
  clearReply(type);

  // Write to Firestore — onSnapshot will update ALL connected clients automatically
  fbAddMessage(msg).catch(err => {
    showNotif('Erro ao enviar mensagem. Tente novamente.', 'error');
    input.value = text; // restore on failure
  });

  // Points for networking (client only)
  if (type === 'client') {
    u.points += 8;
    fbPatchUser(u.id, {points: u.points}).catch(()=>{});
    if (currentUser.id === u.id) currentUser.points = u.points;
    showNotif('+8 pts por participar do networking!', 'success');
  }
}

function filterUsers(q) {
  const term = q.trim().toLowerCase();
  const clients = DB.users.filter(u => u.role === 'client');
  const filtered = term
    ? clients.filter(c =>
        (c.name||'').toLowerCase().includes(term) ||
        (c.company||'').toLowerCase().includes(term) ||
        (c.email||'').toLowerCase().includes(term))
    : clients;
  const tbody = document.getElementById('admin-users-tbody');
  const empty = document.getElementById('users-empty');
  if (tbody) tbody.innerHTML = sortClientsByAccess(filtered).map(c => buildUserRow(c)).join('');
  if (empty) empty.style.display = filtered.length === 0 ? 'block' : 'none';
  const sub = document.getElementById('users-subtitle');
  if (sub) sub.textContent = term
    ? `${filtered.length} resultado${filtered.length !== 1 ? 's' : ''} para "${q.trim()}"`
    : usersSubtitleText(clients);
}

  return `<tr id="row-${id}" style="${susp?'opacity:0.7;':''}">

      <div style="width:32px;height:32px;border-radius:50%;background:${c.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;">${c.avatar}</div>

        <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:0.85rem;font-weight:500;">${c.name}</span>${susp?'<span class="suspended-badge">⛔ Suspenso</span>':''}</div>

      <button class="btn btn-ghost btn-sm" title="Avançar nível" onclick="quickLevelUp('${id}')" style="padding:3px 7px;color:var(--green);border-color:rgba(46,204,143,0.3);">▲</button>

      <span style="font-size:0.75rem;color:var(--muted);">${c.progress}%</span>

function buildAccountsList() {
  const isSuperAdmin = currentUser && currentUser.superadmin === true;
  return DB.users.map(u=>{
    const isAdminUser = u.role==='admin';
    const isSelf = u.id === currentUser?.id;
    const superBadge = u.superadmin ? '<span style="font-size:0.6rem;padding:2px 7px;border-radius:10px;background:rgba(240,165,0,0.15);color:var(--yellow);border:1px solid rgba(240,165,0,0.3);margin-left:4px;">👑 Super</span>' : '';
    let actions = '';
    if (isSuperAdmin && isAdminUser && !isSelf) {
      if (!u.superadmin) {
        actions += `<button class="btn btn-ghost btn-sm" onclick="promoteToSuperAdmin('${u.id}')" style="color:var(--yellow);border-color:rgba(240,165,0,0.3);font-size:0.7rem;">👑 Promover</button>`;
      }
      actions += `<button class="btn btn-danger btn-sm" onclick="deleteAdminUser('${u.id}')" style="font-size:0.7rem;">🗑</button>`;
    }
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);">
      <div style="width:32px;height:32px;border-radius:50%;background:${u.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;overflow:hidden;">${u.photoUrl?`<img src='${u.photoUrl}' style='width:100%;height:100%;object-fit:cover;'>`:u.avatar}</div>

function promoteToSuperAdmin(uid) {
  const u = DB.users.find(x => x.id === uid);
  if (!u || u.role !== 'admin') return;
  openModal('👑 Promover a Super Admin',
    `<p style="color:var(--muted);font-size:0.9rem;line-height:1.6;">Tem certeza que deseja promover <b style="color:var(--light);">${u.name}</b> a <b style="color:var(--yellow);">Super Admin</b>?<br>Ele poderá apagar outras contas de administrador.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn" style="background:rgba(240,165,0,0.15);color:var(--yellow);border:1px solid rgba(240,165,0,0.4);" onclick="confirmPromoteSuperAdmin('${uid}')">👑 Promover</button>`);
}

function confirmPromoteSuperAdmin(uid) {
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  u.superadmin = true;
  fbPatchUser(uid, { superadmin: true }).catch(()=>{});
  addAuditEntry('edit','👑','Promoveu <b>'+u.name+'</b> a Super Admin');
  closeModal();
  showNotif(u.name + ' agora é Super Admin!', 'success');
  const al = document.getElementById('all-accounts-list');
  if (al) al.innerHTML = buildAccountsList();
}

function deleteAdminUser(uid) {
  if (!currentUser || !currentUser.superadmin) { showNotif('Apenas Super Admins podem excluir administradores.', 'error'); return; }
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  if (uid === currentUser.id) { showNotif('Você não pode deletar sua própria conta.', 'error'); return; }
  openModal('🗑 Remover Administrador',
    `<div style="background:rgba(255,92,92,0.06);border:1px solid rgba(255,92,92,0.2);border-radius:4px;padding:10px 14px;font-size:0.85rem;color:var(--muted);margin-bottom:12px;">⚠️ Esta ação é <b>permanente</b> e não pode ser desfeita.</div>
     <p style="color:var(--muted);font-size:0.9rem;line-height:1.6;">Remover o administrador <b style="color:var(--light);">${u.name}</b> (${u.email})?</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-danger" onclick="confirmDeleteAdmin('${uid}')">🗑 Remover administrador</button>`);
}

function confirmDeleteAdmin(uid) {
  const u = DB.users.find(x => x.id === uid);
  const label = u ? u.name + ' (' + u.email + ')' : '#' + uid;
  DB.users.splice(DB.users.findIndex(x => x.id === uid), 1);
  fbRemoveUser(uid).catch(()=>{});
  addAuditEntry('delete','🗑️','Removeu o administrador <b>'+label+'</b>');
  closeModal();
  showNotif('Administrador ' + label + ' removido.', 'success');
  const al = document.getElementById('all-accounts-list');
  if (al) al.innerHTML = buildAccountsList();
}

function renderAdminChatMsgs(level) {
  const msgs=DB.messages[level]||[], u=currentUser;
  if(!msgs.length) return '<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:40px 0;">Nenhuma mensagem neste nível.</div>';
  return msgs.map(m=>{
    const isMine = m.uid===u.id;
    return '<div class="chat-msg ' + (isMine?'mine':'') + (m.pinned?' pinned-msg':'') + '" data-docid="' + (m.docId||'') + '">' +
      '<div class="chat-msg-avatar" style="background:' + m.color + ';color:#fff;">' + (m.photoUrl ? '<img src="'+m.photoUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : m.avatar) + '</div>' +
      '<div>' +
        '<div style="font-size:0.72rem;color:var(--muted);margin-bottom:3px;">' + m.name + '</div>' +
        '<div class="chat-bubble-wrap" style="display:flex;align-items:flex-end;gap:6px;' + (isMine?'flex-direction:row-reverse;':'') + '">' +
          '<div class="chat-bubble' + bubbleClass(m) + '" onclick="if(event.target.closest(\'.chat-del-btn\'))return; showMsgContextMenu(\'' + (m.docId||'') + '\',\'' + m.name.replace(/'/g,"\\'") + '\',\'' + (m.text||'').replace(/'/g,"\\'").replace(/\n/g,' ') + '\',this)">' +
            bubbleTag(m) +
            renderReplyBlock(m) +
            m.text +
          '</div>' +
          (m.docId ? '<button class="chat-del-btn" onclick="deleteMsg(\'' + m.docId + '\')" title="Apagar">✕</button>' : '') +
        '</div>' +
        '<div class="chat-meta">' + m.time + (m.pinned ? ' 📌' : '') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function switchAdminChat(l) {
  currentAdminChatLevel=l;
  document.querySelectorAll('[id^=admin-chat-tab-]').forEach(b=>{ const bl=parseInt(b.id.replace('admin-chat-tab-','')); b.className=`btn ${bl===l?'btn-accent':'btn-ghost'}`; });
  document.getElementById('admin-chat-title').textContent=`Chat — Nível ${l} (${levelName(l)})`;
  // Update container reference for new level and render cached messages
  _chatContainers[l] = 'chat-messages-admin';
  if (DB.messages[l] && DB.messages[l].length) {
    renderChatMessages(l);
  } else {
    document.getElementById('chat-messages-admin').innerHTML = '<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:40px 0;">Nenhuma mensagem ainda neste nível.</div>';
  }
  // Subscribe if not already (admin subscribes to all on login, but just in case)
  fbSubscribeChat(l,'chat-messages-admin');
  fbSubscribeTyping(l,'chat-messages-admin');
  fbSubscribePresence(null,'chat-messages-admin');
}

function loadAdminClientInvestment(uid) {
  // Highlight selected
  document.querySelectorAll('[id^=inv-btn-]').forEach(b => b.classList.remove('btn-accent'));
  const selBtn = document.getElementById('inv-btn-'+uid);
  if(selBtn) { selBtn.classList.remove('btn-ghost'); selBtn.classList.add('btn-accent'); }

  const user = DB.users.find(u => u.id === uid);
  if (!user) return;
  if (!DB.investments[uid]) DB.investments[uid] = { entries:[], roi:{} };
  const data = DB.investments[uid];
  const entries = data.entries || [];
  const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  // Serviços que permitem cálculo de ROI (tráfego pago / performance)
  const ROI_SERVICES = ['Tráfego Pago','Marketing Digital','Gestão de Tráfego'];
  const ALL_SERVICES = ['Branding & Identidade Visual','Criação de Conteúdo','Social Media','Consultoria Estratégica','Marketing Digital','Tráfego Pago','Gestão de Tráfego'];

  const totalInvested = entries.reduce((s,e)=>s+(e.value||0),0);
  // Total ROI: só soma entradas que têm ROI calculável
  const roiEntries = entries.filter(e => ROI_SERVICES.includes(e.service) && e.roi && e.roi.totalReturn > 0);
  const totalRoiInvested = roiEntries.reduce((s,e)=>s+(e.value||0),0);
  const totalRoiReturn   = roiEntries.reduce((s,e)=>s+(e.roi?.totalReturn||0),0);
  const totalRoiPct      = totalRoiInvested>0?(((totalRoiReturn-totalRoiInvested)/totalRoiInvested)*100).toFixed(1):null;

  const panel = document.getElementById('admin-investment-panel');

     <button class="btn btn-accent" onclick="saveEntryROI('${uid}',${idx})">💾 Salvar ROI</button>`

function saveEntryROI(uid, idx) {
  if (!DB.investments[uid]?.entries) return;
  const entry = DB.investments[uid].entries[idx];
  if (!entry) return;
  entry.roi = {
    totalReturn:  parseFloat(document.getElementById('er-return')?.value||'0'),
    leads:        document.getElementById('er-leads')?.value.trim(),
    reach:        document.getElementById('er-reach')?.value.trim(),
    conversions:  document.getElementById('er-conversions')?.value.trim(),
    newClients:   document.getElementById('er-newclients')?.value.trim(),
    cac:          parseFloat(document.getElementById('er-cac')?.value||'0'),
    notes:        document.getElementById('er-notes')?.value.trim(),
  };
  if (typeof _db !== 'undefined') {
    try { _db.collection('investments').doc(uid).set(DB.investments[uid]); } catch(e){}
  }
  const u = DB.users.find(x=>x.id===uid);
  const fmt = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  addAuditEntry('roi','📊',`ROI de ${fmt(entry.roi.totalReturn)} registrado em "${entry.description||entry.service}" para ${u?.name||uid}`);
  closeModal();
  showNotif('ROI salvo com sucesso! 📊','success');
  loadAdminClientInvestment(uid);
}

function adminAddInvestment(uid) {
  const ROI_SERVICES = ['Tráfego Pago','Marketing Digital','Gestão de Tráfego'];
  const service     = document.getElementById('inv-service')?.value;
  const value       = parseFloat(document.getElementById('inv-value')?.value||'0');
  const description = document.getElementById('inv-desc')?.value.trim();
  const date        = document.getElementById('inv-date')?.value;
  const status      = document.getElementById('inv-status')?.value;

  if (!value || value <= 0) { showNotif('Digite um valor válido!','error'); return; }
  if (!DB.investments[uid]) DB.investments[uid] = { entries:[] };

  let roi = null;
  if (ROI_SERVICES.includes(service)) {
    const ret = parseFloat(document.getElementById('inv-roi-return')?.value||'0');
    const leads = document.getElementById('inv-roi-leads')?.value.trim();
    if (ret > 0 || leads) {
      roi = {
        totalReturn:  ret,
        leads:        leads,
        reach:        document.getElementById('inv-roi-reach')?.value.trim(),
        conversions:  document.getElementById('inv-roi-conversions')?.value.trim(),
        newClients:   document.getElementById('inv-roi-newclients')?.value.trim(),
        cac:          parseFloat(document.getElementById('inv-roi-cac')?.value||'0'),
        notes:        document.getElementById('inv-roi-notes')?.value.trim(),
      };
    }
  }

  DB.investments[uid].entries.push({ service, value, description, date, status, roi, id: Date.now() });

  // Sync to Firebase
  if (typeof _db !== 'undefined') {
    try { _db.collection('investments').doc(uid).set(DB.investments[uid]); } catch(e){}
  }

  showNotif('Aporte registrado com sucesso!','success');
  addAuditEntry('investment','💰',`Aporte de R$ ${value.toLocaleString('pt-BR',{minimumFractionDigits:2})} em ${service} para ${DB.users.find(u=>u.id===uid)?.name||uid}`);
  loadAdminClientInvestment(uid);
}

function adminSaveROI(uid) {
  // mantido por compatibilidade — ROI agora é por entrada
  showNotif('Use o botão 📊 ROI em cada aporte para editar o ROI individual.','warn');
  if (typeof _db !== 'undefined') {
    try { _db.collection('investments').doc(uid).set(DB.investments[uid]); } catch(e){}
  }

  showNotif('Resultados de ROI salvos!','success');
  addAuditEntry('roi','📈',`ROI atualizado para ${DB.users.find(u=>u.id===uid)?.name||uid}`);
  loadAdminClientInvestment(uid);
}

function adminDeleteInvestment(uid, idx) {
  if (!DB.investments[uid]?.entries) return;
  DB.investments[uid].entries.splice(idx,1);
  if (typeof _db !== 'undefined') {
    try { _db.collection('investments').doc(uid).set(DB.investments[uid]); } catch(e){}
  }
  showNotif('Aporte removido.','info');
  loadAdminClientInvestment(uid);
}

let auditFilter='all';
function setAuditFilter(f) {
  auditFilter=f;
  document.querySelectorAll('.audit-filter-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('af-'+f); if(el) el.classList.add('active');
  renderAuditList();
}
function renderAuditList() {
  const search=((document.getElementById('audit-search')||{}).value||'').toLowerCase();
  const entries=DB.auditLog.filter(e=>{
    if(auditFilter!=='all'&&e.type!==auditFilter) return false;
    if(search&&!e.action.toLowerCase().includes(search)&&!e.adminName.toLowerCase().includes(search)) return false;
    return true;
  });
  const countEl=document.getElementById('audit-count'); if(countEl) countEl.textContent=entries.length+' registro'+(entries.length!==1?'s':'');
  const body=document.getElementById('audit-log-body'); if(!body) return;
  if(!entries.length){body.innerHTML='<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:32px 0;">Nenhum registro encontrado.</div>';return;}
  const typeColors={create:'var(--green)',edit:'var(--accent-light)',delete:'var(--red)',level:'var(--yellow)',suspend:'#a78bfa',unsuspend:'var(--green)',task:'var(--accent-light)'};
  body.innerHTML=entries.map(e=>`
    <div class="audit-item">
      <div class="audit-icon type-${e.type}">${e.icon}</div>
      <div class="audit-content">
        <div class="audit-action">${e.action}</div>
        <div class="audit-meta">Por <span class="audit-admin">${e.adminName}</span> · ${e.time}</div>
      </div>
      <span style="font-size:0.65rem;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,0.2);color:${typeColors[e.type]||'var(--muted)'};border:1px solid ${typeColors[e.type]||'var(--muted)'}44;">${e.type}</span>
    </div>`).join('');
}
function clearAuditLog() {
  openModal('Limpar log','<p style="color:var(--muted);font-size:0.9rem;line-height:1.6;">Tem certeza que deseja apagar todo o histórico?</p>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="DB.auditLog=[];renderAuditList();closeModal();showNotif(\'Log limpo.\',\'error\');">Confirmar limpeza</button>');
}

function createUser() {
  const name=document.getElementById('new-name').value.trim();
  const email=document.getElementById('new-email').value.trim();
  const pass=document.getElementById('new-pass').value;
  const isAdmin=newAccountType==='admin';
  if(!name||!email||!pass){showNotif('Preencha nome, e-mail e senha!','error');return;}
  if(DB.users.find(u=>u.email===email)){showNotif('Este e-mail já está cadastrado!','error');return;}
  const colors=['#3d8bff','#2ecc8f','#f0a500','#a78bfa','#ff6b6b','#06d6a0','#e879f9','#38bdf8'];
  const color=colors[DB.users.length%colors.length];
  showFBLoading('Criando conta...');
  _auth.createUserWithEmailAndPassword(email,pass)
    .then(async cred=>{
      const uid=cred.user.uid;
      let newUser;
      if(isAdmin) {
        newUser={id:uid,name,email,pass,role:'admin',company:'Evastek',level:0,progress:100,points:0,avatar:getInitials(name),color:'#1a5fa8',suspended:null};
        addAuditEntry('create','🛡️','Criou conta de administrador para <b>'+name+'</b>');
      } else {
        const company=document.getElementById('new-company').value.trim();
        const level=parseInt(document.getElementById('new-level').value);
        if(!company){hideFBLoading();showNotif('Informe o nome da empresa!','error');return;}
        // New clients start with NO tasks — admin adds them via task editor
        newUser={id:uid,name,email,pass,role:'client',company,level,progress:0,points:0,avatar:getInitials(name),color,tasks:[],suspended:null};
        addAuditEntry('create','✅','Criou conta do cliente <b>'+name+'</b> ('+company+') — Nível '+level);
      }
      await fbSaveUser(newUser);
      await fbSyncUsers();
      // Re-sign in as admin
      const adminEmail=currentUser.email, adminPass=currentUser.pass;
      await _auth.signInWithEmailAndPassword(currentUser.email, currentUser.pass).catch(()=>{});
      hideFBLoading();
      showNotif((isAdmin?'Administrador ':'Cliente ')+name+' criado com sucesso!','success');
      ['new-name','new-email','new-pass','new-company'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
      const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
      const al=document.getElementById('all-accounts-list'); if(al) al.innerHTML=buildAccountsList();
      const sub=document.getElementById('users-subtitle'); if(sub) sub.textContent=DB.users.filter(u=>u.role==='client').length+' contas cadastradas';
    })

function saveEditUser(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  const _cs=document.getElementById('edit-cstart').value||'', _ce=document.getElementById('edit-cend').value||'';
  let _pd=parseInt(document.getElementById('edit-payday').value,10); if(!(_pd>=1&&_pd<=31)) _pd='';
  if(_cs&&_ce&&_ce<_cs){showNotif('O término do contrato não pode ser antes do início.','error');return;}
  const newLevel=parseInt(document.getElementById('edit-level').value);
  const levelChanged=newLevel!==u.level;
  u.name=document.getElementById('edit-name').value.trim()||u.name;
  u.company=document.getElementById('edit-company').value.trim()||u.company;
  u.email=document.getElementById('edit-email').value.trim()||u.email;
  const np=document.getElementById('edit-pass').value; if(np) u.pass=np;
  u.level=newLevel;
  u.progress=parseInt(document.getElementById('edit-progress').value)||0;
  u.points=parseInt(document.getElementById('edit-points').value)||0;
  u.contractStart=_cs; u.contractEnd=_ce; u.payDay=_pd;
  u.avatar=getInitials(u.name);
  if(levelChanged) addAuditEntry('level','🔄','Alterou nível de <b>'+u.name+'</b> ('+u.company+') para Nível '+u.level);
  else addAuditEntry('edit','✏️','Editou dados de <b>'+u.name+'</b> ('+u.company+')');
  fbPatchUser(uid,{name:u.name,company:u.company,email:u.email,pass:u.pass,level:u.level,progress:u.progress,points:u.points,avatar:u.avatar,tasks:u.tasks||[],contractStart:u.contractStart,contractEnd:u.contractEnd,payDay:u.payDay}).catch(()=>{});
  showNotif('Cliente atualizado!','success');
  closeModal();
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
}

// ══════════════════════════════════
//  ADMIN ACTIONS — EDITOR DE TAREFAS

function openTaskEditor(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  _taskNextId=Math.max(_taskNextId,Date.now());
  _taskDraft={uid,tasks:(u.tasks||[]).map(t=>({id:t.id,label:t.label,points:t.points,done:!!t.done})),picker:null};
  renderTaskEditorModal(u);
}

let _taskDraft=null;
let _taskNextId=Date.now();
function _escAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Lê o que está na tela (texto/pontos) para o rascunho, antes de re-renderizar
function syncDraftFromDOM() {
  if(!_taskDraft) return;
  _taskDraft.tasks.forEach(t=>{
    const l=document.getElementById('task-label-'+t.id);
    const p=document.getElementById('task-pts-'+t.id);
    if(l) t.label=l.value;
    if(p) t.points=parseInt(p.value)||t.points||10;
  });
}

function renderTaskEditorModal(u) {
  if(!_taskDraft||_taskDraft.uid!==u.id) return;
  const tasks=_taskDraft.tasks;
  const taskRows=tasks.map(t=>`
    <div class="task-edit-row" id="task-row-${t.id}">
      <div class="task-done-toggle" style="border-color:${t.done?'var(--green)':'var(--border)'};background:${t.done?'var(--green)':'transparent'};" onclick="toggleTaskDoneAdmin('${u.id}',${t.id},this)" title="${t.done?'Clique para desmarcar':'Clique para marcar como feita'}">
        ${t.done?'<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.5"><path d="M2 5l2.5 2.5L8 3"/></svg>':''}
      </div>
      <input type="text" id="task-label-${t.id}" value="${_escAttr(t.label)}" placeholder="Descreva a tarefa..."/>
      <input type="number" id="task-pts-${t.id}" value="${t.points}" min="1" max="500" title="Pontos"/>
      <span style="font-size:0.65rem;color:var(--muted);white-space:nowrap;">pts</span>
      <button class="btn btn-danger btn-sm" style="flex-shrink:0;" onclick="removeTaskRow('${u.id}',${t.id})">✕</button>
    </div>`).join('');

  let picker='';
  const pl=_taskDraft.picker;
  if(pl){
    const existing=new Set(tasks.map(t=>t.label.trim().toLowerCase()));
    const items=levelTaskTemplates(pl).map((t,i)=>{
      const dup=existing.has(t.label.trim().toLowerCase());
      return `<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:0.78rem;cursor:pointer;${dup?'opacity:0.5;':''}">
        <input type="checkbox" class="tpl-pick" data-i="${i}" ${dup?'disabled':'checked'}/>
        <span style="flex:1;">${_escAttr(t.label)}${dup?' <i style="color:var(--muted);">(já está na lista)</i>':''}</span>
        <span style="color:var(--muted);font-size:0.7rem;">${t.points} pts</span></label>`;}).join('');
    picker=`<div style="margin-top:12px;border:1px solid rgba(46,204,143,0.35);border-radius:4px;padding:10px 12px;">
      <div style="font-size:0.8rem;font-weight:500;margin-bottom:6px;">Modelo Nível ${pl} — desmarque as tarefas que não quer</div>
      <div style="max-height:220px;overflow-y:auto;">${items}</div>
      <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" onclick="cancelTaskPicker('${u.id}')">Cancelar</button>
        <button class="btn btn-accent btn-sm" onclick="confirmTaskPicker('${u.id}')">Adicionar selecionadas</button>
      </div></div>`;
  }

  const body=`
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:0.82rem;font-weight:500;">${u.company} — ${levelBadge(u.level)}</div>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">${tasks.filter(t=>t.done).length}/${tasks.length} tarefas concluídas · ${u.points} pts acumulados</div>
      </div>
      <button class="btn btn-accent btn-sm" onclick="addTaskRowTemplate('${u.id}')">+ Adicionar tarefa</button>
    </div>
    <div style="background:rgba(61,139,255,0.06);border:1px solid rgba(61,139,255,0.2);border-radius:4px;padding:8px 12px;margin-bottom:14px;font-size:0.75rem;color:var(--muted);">
      <b style="color:var(--accent-light);">Como usar:</b> escolha um modelo de nível, marque só as tarefas que o cliente precisa e adicione. Você pode depois incluir mais tarefas próprias, editar ou remover (✕). Nada é gravado até clicar em Salvar.
    </div>
    <div style="display:grid;grid-template-columns:24px 1fr 70px 30px 36px;gap:6px;padding:0 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px;">
      <div style="font-size:0.65rem;color:var(--muted);text-align:center;">✓</div>
      <div style="font-size:0.65rem;color:var(--muted);">Descrição</div>
      <div style="font-size:0.65rem;color:var(--muted);text-align:center;">Pts</div>
      <div></div><div></div>
    </div>
    <div id="task-editor-rows" style="max-height:300px;overflow-y:auto;">${taskRows||'<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:20px 0;">Nenhuma tarefa. Use um modelo ou "+ Adicionar tarefa".</div>'}</div>
    <div style="margin-top:14px;">
      <div style="background:rgba(46,204,143,0.06);border:1px solid rgba(46,204,143,0.2);border-radius:4px;padding:8px 12px;font-size:0.75rem;color:var(--muted);">
        <b style="color:var(--green);">Modelos rápidos:</b>&nbsp;
        ${[1,2,3,4].map(l=>`<button class="btn btn-ghost btn-sm" style="font-size:0.65rem;padding:3px 8px;margin:2px;" onclick="applyTaskTemplate('${u.id}',${l})">Nível ${l}</button>`).join('')}
      </div>
    </div>${picker}`;

  openModal(`📋 Tarefas — ${u.name}`, body,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-accent" onclick="saveTaskEditor('${u.id}')">💾 Salvar tarefas</button>`, true);
}

function toggleTaskDoneAdmin(uid, tid, el) {
  if(!_taskDraft) return;
  const task=_taskDraft.tasks.find(t=>t.id===tid); if(!task) return;
  task.done=!task.done;
  el.style.borderColor=task.done?'var(--green)':'var(--border)';
  el.style.background=task.done?'var(--green)':'transparent';
  el.innerHTML=task.done?'<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.5"><path d="M2 5l2.5 2.5L8 3"/></svg>':'';
}

function removeTaskRow(uid, tid) {
  if(!_taskDraft) return;
  _taskDraft.tasks=_taskDraft.tasks.filter(t=>t.id!==tid);
  const row=document.getElementById('task-row-'+tid); if(row) row.remove();
  const container=document.getElementById('task-editor-rows');
  if(container&&!container.querySelector('.task-edit-row')) container.innerHTML='<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:20px 0;">Nenhuma tarefa. Use um modelo ou "+ Adicionar tarefa".</div>';
}

function addTaskRowTemplate(uid) {
  if(!_taskDraft) return;
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  syncDraftFromDOM();
  _taskNextId++;
  _taskDraft.tasks.push({id:_taskNextId,label:'',points:30,done:false});
  renderTaskEditorModal(u);
  const c=document.getElementById('task-editor-rows'); if(c) c.scrollTop=c.scrollHeight;
  document.getElementById('task-label-'+_taskNextId)?.focus();
}

// Abre a lista de seleção do modelo (não substitui nada)
function applyTaskTemplate(uid, level) {
  const u=DB.users.find(x=>x.id===uid); if(!u||!_taskDraft) return;
  syncDraftFromDOM();
  _taskDraft.picker=level;
  renderTaskEditorModal(u);
}
function cancelTaskPicker(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u||!_taskDraft) return;
  syncDraftFromDOM();
  _taskDraft.picker=null;
  renderTaskEditorModal(u);
}
function confirmTaskPicker(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u||!_taskDraft) return;
  const level=_taskDraft.picker;
  const tpl=levelTaskTemplates(level);
  const picked=[...document.querySelectorAll('.tpl-pick:checked')].map(c=>parseInt(c.dataset.i));
  syncDraftFromDOM();
  picked.forEach(i=>{ _taskNextId++; _taskDraft.tasks.push({id:_taskNextId,label:tpl[i].label,points:tpl[i].points,done:false}); });
  _taskDraft.picker=null;
  renderTaskEditorModal(u);
  if(picked.length) showNotif(picked.length+' tarefa'+(picked.length!==1?'s':'')+' adicionada'+(picked.length!==1?'s':'')+' — clique em Salvar para gravar','success');
}

function saveTaskEditor(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u||!_taskDraft) return;
  syncDraftFromDOM();
  const newTasks=[];
  _taskDraft.tasks.forEach(t=>{
    const label=(t.label||'').trim();
    if(label) newTasks.push({id:newTasks.length+1,label,points:parseInt(t.points)||10,done:!!t.done});
  });
  _taskDraft=null;
  u.tasks=newTasks;
  recalcUser(u);
  addAuditEntry('task','📋','Atualizou tarefas de <b>'+u.name+'</b> ('+u.company+') — '+newTasks.length+' tarefa'+(newTasks.length!==1?'s':''));
  // Auto level-up: se 100% concluído e não está no nível máximo
  const oldLevel=u.level;
  const didLevelUp=u.progress>=100&&u.level<4;
  if(didLevelUp){
    u.level=oldLevel+1;
    u.tasks=[];
    u.progress=0;
    u.points=0;
    addAuditEntry('level','⬆️','Avançou automaticamente <b>'+u.name+'</b> ('+u.company+') de Nível '+oldLevel+' para Nível '+u.level+' — 100% das tarefas concluídas');
  }
  fbPatchUser(uid,{tasks:u.tasks,points:u.points,progress:u.progress,level:u.level}).catch(e=>{showNotif('Erro ao salvar tarefas: '+e.message,'error');});
  showNotif(didLevelUp?'🎉 '+u.name+' avançou para Nível '+u.level+' — '+levelName(u.level)+'!':'Tarefas salvas com sucesso!','success');
  closeModal();
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
}
