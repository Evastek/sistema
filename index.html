// ── DB Helpers ──
async function fbSyncUsers() {
  const snap = await _db.collection('users').get();
  DB.users = [];
  snap.forEach(d => DB.users.push({ ...d.data(), id: d.id }));
}
async function fbSyncAudit() {
  DB.auditLog = [];
  try {
    const snap = await _db.collection('auditLog').get();
    snap.forEach(d => DB.auditLog.push({ ...d.data(), id: d.id }));
    // Ordenar do mais recente para o mais antigo em memória
    DB.auditLog.sort((a,b) => (b.ts||0) - (a.ts||0));
  } catch(e) { console.warn('fbSyncAudit error:', e.message); }
}
async function fbSyncMessages() {
  DB.messages = {1:[],2:[],3:[],4:[]};
  try {
    // Sem orderBy para não exigir índice composto no Firestore
    const snap = await _db.collection('messages').get();
    snap.forEach(d => {
      const m = d.data(), l = m.level;
      if (!DB.messages[l]) DB.messages[l] = [];
      DB.messages[l].push({ ...m, docId: d.id });
    });
    // Ordenar em memória por ts (pode ser Timestamp ou número)
    Object.keys(DB.messages).forEach(l => {
      DB.messages[l].sort((a,b) => {
        const ta = a.ts && a.ts.toMillis ? a.ts.toMillis() : (a.ts||0);
        const tb = b.ts && b.ts.toMillis ? b.ts.toMillis() : (b.ts||0);
        return ta - tb;
      });
    });
  } catch(e) { console.warn('fbSyncMessages error:', e.message); }
}
async function fbSyncInvestments() {
  DB.investments = {};
  try {
    const snap = await _db.collection('investments').get();
    snap.forEach(d => { DB.investments[d.id] = d.data(); });
  } catch(e) {}
}
async function fbSaveUser(user) {
  const { id, ...data } = user;
  await _db.collection('users').doc(String(id)).set(data);
}
async function fbPatchUser(uid, fields) {
  await _db.collection('users').doc(String(uid)).set(fields, { merge: true });
}
async function fbRemoveUser(uid) {
  await _db.collection('users').doc(String(uid)).delete();
}
async function fbAddMessage(msg) {
  const ref = await _db.collection('messages').add({ ...msg, ts: firebase.firestore.FieldValue.serverTimestamp() });
  return ref.id;
}
async function fbDeleteMessage(docId) {
  await _db.collection('messages').doc(String(docId)).delete();
}
async function fbAddAudit(entry) {
  try { await _db.collection('auditLog').add({ ...entry, ts: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
}

let _chatUnsub = null;
// ── Chat subscriptions: one per level, persistent while logged in ──
const _chatUnsubs = {};   // level → unsubscribe fn
const _chatContainers = {}; // level → current container id

// Track last seen message counts per level
const _lastSeenCount = {};
let _unreadCount = 0;

function renderChatMessages(level) {
  const containerId = _chatContainers[level];
  if (!containerId || !currentUser) return;
  const el = document.getElementById(containerId);
  const msgs = DB.messages[level] || [];
  const isAdmin = currentUser.role === 'admin';

  // Track unread — notify if user not on chat page
  const prevCount = _lastSeenCount[level] || 0;
  const newCount = msgs.length;
  const isOnChatPage = (currentPage === 'client-chat' || currentPage === 'admin-chat');

  if (newCount > prevCount && prevCount > 0 && !isOnChatPage) {
    const newest = msgs[msgs.length - 1];
    if (newest && newest.uid !== currentUser.id) {
      _unreadCount += (newCount - prevCount);
      updateUnreadBadge();
      // Toast notification for new message
      showNotif('💬 Nova mensagem de ' + newest.name + ': ' + newest.text.substring(0,40) + (newest.text.length>40?'...':''), 'success');
    }
  }
  if (isOnChatPage) {
    _unreadCount = 0;
    updateUnreadBadge();
  }
  _lastSeenCount[level] = newCount;

  if (!el) return;

  if (!msgs.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:40px 0;">Nenhuma mensagem ainda neste nível.</div>';
    return;
  }

  // Smart scroll: only auto-scroll if user was near bottom
  const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;

  el.innerHTML = msgs.map(m => {
    const isMine = m.uid === currentUser.id;
    const canDel = isAdmin || isMine;
    const delBtn = (canDel && m.docId) ? '<button class="chat-del-btn" onclick="deleteMsg(\'' + m.docId + '\')" title="Apagar">✕</button>' : '';
    const nameEl = !isMine ? '<div style="font-size:0.72rem;color:var(--muted);margin-bottom:3px;">' + m.name + '</div>' : '';
    const dir = isMine ? 'flex-direction:row-reverse;' : '';
    return '<div class="chat-msg ' + (isMine?'mine':'') + (m.pinned?' pinned-msg':'') + '">' +
      '<div class="chat-msg-avatar" style="background:' + m.color + ';color:#fff;">' + (m.photoUrl ? '<img src="'+m.photoUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : m.avatar) + '</div>' +
      '<div style="max-width:75%;">' + nameEl +
        '<div class="chat-bubble-wrap" style="display:flex;align-items:flex-end;gap:6px;' + dir + '">' +
          '<div class="chat-bubble' + bubbleClass(m) + '" onclick="if(event.target.closest(\'.chat-del-btn\'))return; showMsgContextMenu(\'' + (m.docId||'') + '\',\'' + m.name.replace(/'/g,"\\'") + '\',\'' + (m.text||'').replace(/'/g,"\\'").replace(/\n/g,' ') + '\',this)">' +
            bubbleTag(m) +
            renderReplyBlock(m) +
            m.text +
          '</div>' + delBtn +
        '</div>' +
        '<div class="chat-meta">' + m.time + (m.pinned ? ' 📌' : '') + '</div>' +
      '</div></div>';
  }).join('');

  if (wasAtBottom) el.scrollTop = el.scrollHeight;

  // Update pinned banner
  renderPinnedBanner(level, containerId);
}

function updateUnreadBadge() {
  // Find the chat nav item and update badge
  const chatNavId = currentUser && currentUser.role === 'admin' ? 'nav-admin-chat' : 'nav-client-chat';
  const navEl = document.getElementById(chatNavId);
  if (!navEl) return;
  let badge = navEl.querySelector('.nav-badge-count');
  if (_unreadCount > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'nav-badge-count';
      // Remove AO VIVO badge temporarily
      const liveBadge = navEl.querySelector('.nav-badge');
      if (liveBadge) liveBadge.style.display = 'none';
      navEl.appendChild(badge);
    }
    badge.textContent = _unreadCount > 99 ? '99+' : _unreadCount;
  } else {
    if (badge) badge.remove();
    const liveBadge = navEl.querySelector('.nav-badge');
    if (liveBadge) liveBadge.style.display = '';
  }
}

function fbSubscribeChat(level, containerId) {
  // Update which container this level should render into
  _chatContainers[level] = containerId;

  // Already subscribed to this level — just re-render into new container
  if (_chatUnsubs[level]) {
    renderChatMessages(level);
    return;
  }

  // New subscription
  // Sem orderBy — evita exigência de índice composto no Firestore
  // Ordenação feita em memória após cada snapshot
  const unsub = _db.collection('messages')
    .where('level','==',level)
    .onSnapshot(snap => {
      const msgs = [];
      snap.forEach(d => msgs.push({ ...d.data(), docId: d.id }));
      // Ordenar por ts em memória
      msgs.sort((a,b) => {
        const ta = a.ts && a.ts.toMillis ? a.ts.toMillis() : (a.ts||0);
        const tb = b.ts && b.ts.toMillis ? b.ts.toMillis() : (b.ts||0);
        return ta - tb;
      });
      DB.messages[level] = msgs;
      renderChatMessages(level);
    }, err => {
      console.warn('Chat listener error:', err.message);
      delete _chatUnsubs[level];
      setTimeout(() => fbSubscribeChat(level, _chatContainers[level] || containerId), 4000);
    });
  _chatUnsubs[level] = unsub;
}

function fbUnsubscribeAllChats() {
  Object.values(_chatUnsubs).forEach(unsub => { try { unsub(); } catch(e){} });
  Object.keys(_chatUnsubs).forEach(k => delete _chatUnsubs[k]);
}

// ══════════════════════════════════════════════════════════
//  TYPING INDICATOR — Firestore realtime
// ══════════════════════════════════════════════════════════
const _typingUnsubs  = {};  // level → unsub fn
const _typingTimeouts = {}; // level → timeout id

function fbSetTyping(level, isTyping) {
  if (!currentUser || !level) return;
  const docId = String(level) + '_' + String(currentUser.id);
  if (isTyping) {
    _db.collection('typing').doc(docId).set({
      uid: currentUser.id, name: currentUser.name, level: level,
      typing: true, ts: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(()=>{});
  } else {
    _db.collection('typing').doc(docId).delete().catch(()=>{});
  }
}

function fbSubscribeTyping(level, containerId) {
  if (_typingUnsubs[level]) return; // already subscribed
  const unsub = _db.collection('typing').where('level','==',level)
    .onSnapshot(snap => {
      if (!currentUser) return;
      const names = [];
      const now = Date.now();
      snap.forEach(d => {
        const data = d.data();
        if (data.uid === currentUser.id) return;
        const ts = data.ts?.toMillis ? data.ts.toMillis() : (data.ts||0);
        if (data.typing && (now - ts) < 6000) names.push(data.name.split(' ')[0]);
      });
      const indId = 'typing-ind-' + containerId;
      const el = document.getElementById(indId);
      if (!el) return;
      if (names.length) {
        const label = names.length === 1
          ? names[0] + ' está digitando'
          : names.slice(0,-1).join(', ') + ' e ' + names[names.length-1] + ' estão digitando';
        el.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span><span>' + label + '...</span>';
        el.style.display = 'flex';
      } else {
        el.style.display = 'none';
      }
    }, () => { delete _typingUnsubs[level]; });
  _typingUnsubs[level] = unsub;
}

// ══════════════════════════════════════════════════════════
//  PRESENCE — ativo somente com interação real (2 min timeout)
// ══════════════════════════════════════════════════════════
let _presenceUnsub = null;
let _activityTimeout = null;
const ACTIVITY_TTL = 2 * 60 * 1000; // 2 minutos sem interação → offline

function fbSetPresence(online) {
  if (!currentUser || window._adminUser) return; // admin vendo como cliente não conta como presença do cliente
  const docId = String(currentUser.id);
  if (online) {
    _db.collection('presence').doc(docId).set({
      uid: currentUser.id, name: currentUser.name, avatar: currentUser.avatar,
      photoUrl: currentUser.photoUrl || null,
      color: currentUser.color, role: currentUser.role, level: currentUser.level,
      online: true, ts: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(()=>{});
  } else {
    _db.collection('presence').doc(docId).delete().catch(()=>{});
  }
}

let _presenceThrottle = 0;
function onUserActivity() {
  if (!currentUser) return;
  touchLastSeen();
  const _now = Date.now();
  if (_now - _presenceThrottle > 5000) { _presenceThrottle = _now; fbSetPresence(true); }
  clearTimeout(_activityTimeout);
  _activityTimeout = setTimeout(() => {
    fbSetPresence(false);
  }, ACTIVITY_TTL);
}

function startActivityTracking() {
  const events = ['mousemove','mousedown','keydown','touchstart','scroll','click'];
  events.forEach(ev => window.addEventListener(ev, onUserActivity, { passive: true }));
  // Aciona imediatamente ao logar
  onUserActivity();
}

function stopActivityTracking() {
  clearTimeout(_activityTimeout);
  fbSetPresence(false);
}

// ══════════════════════════════════════════════════════════
//  ÚLTIMO ACESSO DO CLIENTE
//  lastLogin = último login · lastSeen = última atividade · loginCount = total de logins
// ══════════════════════════════════════════════════════════
const LASTSEEN_EVERY = 3 * 60 * 1000;   // grava "última atividade" no máx. a cada 3 min
const ONLINE_WINDOW  = 3 * 60 * 1000;   // presença mais velha que isso = offline
let _lastSeenWrite = 0;
let _usersSort = 'default';
let _presenceTs = {};
let _accessUnsub = null, _onlinePresUnsub = null, _accessTick = null;

function tsMs(v) {
  if (!v) return 0;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  return 0;
}
function accessTs(c) { return Math.max(tsMs(c.lastSeen), tsMs(c.lastLogin)); }

function recordClientLogin(u) {
  const now = Date.now();
  _lastSeenWrite = now;
  u.lastLogin = now; u.lastSeen = now; u.loginCount = (u.loginCount || 0) + 1;
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  fbPatchUser(u.id, { lastLogin: ts, lastSeen: ts, loginCount: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
}
function touchLastSeen() {
  if (!currentUser || currentUser.role !== 'client' || window._adminUser) return;
  const now = Date.now();
  if (now - _lastSeenWrite < LASTSEEN_EVERY) return;
  _lastSeenWrite = now;
  currentUser.lastSeen = now;
  fbPatchUser(currentUser.id, { lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
}

// ── Admin: acompanha mudanças em tempo real ──
function startAdminAccessWatch() {
  stopAdminAccessWatch();
  try {
    _accessUnsub = _db.collection('users').where('role', '==', 'client').onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed') return;
        const d = ch.doc.data();
        const u = DB.users.find(x => String(x.id) === ch.doc.id);
        if (!u) return;
        ['lastLogin', 'lastSeen', 'loginCount'].forEach(k => { if (d[k] !== undefined) u[k] = d[k]; });
      });
      refreshAccessColumn();
    }, () => {});
    _onlinePresUnsub = _db.collection('presence').onSnapshot(snap => {
      const map = {};
      snap.forEach(d => {
        const p = d.data();
        if (p.role === 'client') map[String(p.uid)] = tsMs(p.ts);   // 0 = gravação ainda pendente (conta como agora)
      });
      _presenceTs = map;
      refreshAccessColumn();
    }, () => {});
  } catch (e) {}
  _accessTick = setInterval(refreshAccessColumn, 60000);   // mantém "há X min" atualizado
}
function stopAdminAccessWatch() {
  if (_accessUnsub) { try { _accessUnsub(); } catch (e) {} _accessUnsub = null; }
  if (_onlinePresUnsub) { try { _onlinePresUnsub(); } catch (e) {} _onlinePresUnsub = null; }
  if (_accessTick) { clearInterval(_accessTick); _accessTick = null; }
  _presenceTs = {};
}

function isOnlineNow(c) {
  const p = _presenceTs[String(c.id)];
  return p !== undefined && (p === 0 || Date.now() - p < ONLINE_WINDOW);
}
function fmtDateTime(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function fmtShort(ms) {
  const d = new Date(ms);
  if (d.getFullYear() !== new Date().getFullYear()) return fmtDateTime(ms);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function relTime(ms) {
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'agora há pouco';
  if (m < 60) return 'há ' + m + ' min';
  const h = Math.floor(m / 60);
  if (h < 24) return 'há ' + h + ' h';
  const d = Math.floor(h / 24);
  if (d === 1) return 'ontem';
  if (d < 30) return 'há ' + d + ' dias';
  const mo = Math.floor(d / 30);
  if (mo < 12) return 'há ' + mo + (mo === 1 ? ' mês' : ' meses');
  return 'há mais de 1 ano';
}

function buildAccessCell(c) {
  const login = tsMs(c.lastLogin), seen = tsMs(c.lastSeen), last = Math.max(login, seen);
  const tip = [
    login ? 'Último login: ' + fmtDateTime(login) : '',
    seen ? 'Última atividade: ' + fmtDateTime(seen) : '',
    c.loginCount ? 'Total de acessos: ' + c.loginCount : ''
  ].filter(Boolean).join('\n');
  if (isOnlineNow(c)) {
    return `<div title="${tip}"><div class="la la-online"><span class="la-dot"></span>Online agora</div>${login ? `<div class="la-sub">Login em ${fmtShort(login)}</div>` : ''}</div>`;
  }
  if (!last) {
    return `<div title="O registro começa no próximo login deste cliente."><div class="la la-none">Sem registro</div><div class="la-sub">Registra no próximo login</div></div>`;
  }
  const days = (Date.now() - last) / 864e5;
  const cls = days > 30 ? 'la-cold' : days > 7 ? 'la-warn' : days >= 2 ? 'la-muted' : '';
  return `<div title="${tip}"><div class="la ${cls}">${relTime(last)}</div><div class="la-sub">${fmtShort(last)}</div></div>`;
}

function usersSubtitleText(clients) {
  const base = clients.length + ' contas cadastradas';
  if (!clients.length) return base;
  const on = clients.filter(isOnlineNow).length;
  const cold = clients.filter(c => { const t = accessTs(c); return t && Date.now() - t > 7 * 864e5 && !isOnlineNow(c); }).length;
  const parts = [];
  if (on) parts.push(on + ' online agora');
  if (cold) parts.push(cold + ' sem acesso há mais de 7 dias');
  return parts.length ? base + ' — ' + parts.join(', ') : base;
}

function refreshAccessColumn() {
  if (!document.getElementById('admin-users-tbody')) return;
  DB.users.forEach(u => {
    if (u.role !== 'client') return;
    const cell = document.getElementById('access-' + u.id);
    if (cell) cell.innerHTML = buildAccessCell(u);
  });
  const sub = document.getElementById('users-subtitle'), q = document.getElementById('users-search');
  if (sub && (!q || !q.value.trim())) sub.textContent = usersSubtitleText(DB.users.filter(u => u.role === 'client'));
}

function sortClientsByAccess(list) {
  if (_usersSort === 'default') return list;
  const key = c => isOnlineNow(c) ? Date.now() : accessTs(c);
  const withTs = list.filter(c => key(c)), without = list.filter(c => !key(c));
  withTs.sort((a, b) => _usersSort === 'recent' ? key(b) - key(a) : key(a) - key(b));
  return withTs.concat(without);
}
function setUsersSort(v) {
  _usersSort = v;
  const q = document.getElementById('users-search');
  filterUsers(q ? q.value : '');
}

// level=null → admin (mostra todos); level=N → clientes daquele nível
function fbSubscribePresence(level, containerId) {
  if (_presenceUnsub) { try{_presenceUnsub();}catch(e){} _presenceUnsub=null; }
  let query = _db.collection('presence');
  if (level !== null) query = query.where('level','==',level);
  _presenceUnsub = query.onSnapshot(snap => {
    if (!currentUser) return;
    const users = [];
    snap.forEach(d => { const data = d.data(); users.push(data); });
    const el = document.getElementById('presence-' + containerId);
    if (!el) return;
    if (!users.length) {
      // Nenhum online: esconde o pill completamente
      el.style.display = 'none';
      return;
    }
    el.style.display = 'flex';
    const count = users.length;
    const avatarHtml = users.slice(0,5).map(u =>
      `<span title="${u.name}${u.role==='admin'?' (Admin)':''}" style="width:22px;height:22px;border-radius:50%;background:${u.color};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:0.52rem;font-weight:700;border:2px solid var(--dark2);flex-shrink:0;">${u.photoUrl?`<img src='${u.photoUrl}' style='width:100%;height:100%;object-fit:cover;border-radius:50%;'>`:u.avatar}</span>`
    ).join('');
    el.innerHTML = `<span class="live-dot" style="width:7px;height:7px;"></span><span style="font-size:0.72rem;color:var(--green);font-weight:600;">${count} online</span>${avatarHtml}`;
  }, () => {});
}

function fbUnsubscribePresenceAndTyping() {

.audit-icon.type-level{background:rgba(240,165,0,0.15);border:1px solid rgba(240,165,0,0.3);}
.audit-icon.type-suspend{background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);}
.audit-icon.type-unsuspend{background:rgba(46,204,143,0.15);border:1px solid rgba(46,204,143,0.3);}
.audit-icon.type-task{background:rgba(61,139,255,0.1);border:1px solid rgba(61,139,255,0.2);}
.audit-content{flex:1;} .audit-action{font-size:0.85rem;font-weight:500;line-height:1.4;margin-bottom:3px;}
.audit-meta{font-size:0.72rem;color:var(--muted);} .audit-admin{color:var(--accent-light);font-weight:600;}
.audit-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.audit-filter-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:all 0.2s;}
.audit-filter-btn.active{border-color:var(--accent-light);color:var(--accent-light);background:rgba(61,139,255,0.08);}
.suspended-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:10px;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:rgba(255,92,92,0.12);color:var(--red);border:1px solid rgba(255,92,92,0.3);}
.suspend-modal-opts{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
.suspend-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all 0.2s;}
.suspend-opt:hover,.suspend-opt.selected{border-color:var(--red);background:rgba(255,92,92,0.06);}
.suspend-opt input[type=radio]{accent-color:var(--red);width:16px;height:16px;}
.task-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.task-edit-row:last-child{border-bottom:none;}
.task-edit-row input[type=text]{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:4px;padding:7px 10px;color:var(--light);font-family:'DM Sans',sans-serif;font-size:0.83rem;outline:none;}
.task-edit-row input[type=text]:focus{border-color:var(--accent-light);}
.task-edit-row input[type=number]{width:70px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:4px;padding:7px 8px;color:var(--light);font-family:'DM Sans',sans-serif;font-size:0.83rem;outline:none;text-align:center;}
.task-done-toggle{width:20px;height:20px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s;}
/* LEVEL UP FULLSCREEN */
#levelup-overlay{position:fixed;inset:0;z-index:99998;pointer-events:none;display:block;}
#levelup-overlay.active{pointer-events:all;}
.levelup-backdrop{position:absolute;inset:0;background:rgba(4,6,12,0.97);opacity:0;transition:opacity 0.4s ease;}
#lu-rocket-phase{display:none;}
#lu-rocket-phase.active{display:flex!important;}
#lu-explosion-phase{display:none;}
#lu-explosion-phase.active{display:flex!important;}
#lu-main-phase{display:none;}
#lu-main-phase.active{display:flex!important;}
#confetti-canvas{position:fixed;inset:0;z-index:99997;pointer-events:none;opacity:0;transition:opacity 0.3s;}
#confetti-canvas.active{opacity:1;}

/* ══════════════════════════════════════════════
   LEVEL UP — ENHANCED PROFESSIONAL VISUALS
══════════════════════════════════════════════ */

/* Backdrop: radial gradient profundo + blur */
.levelup-backdrop{
  background:radial-gradient(ellipse 90% 75% at 50% 35%,rgba(8,14,28,0.96) 0%,rgba(2,4,10,1) 100%)!important;
}

/* Scanline de cinema — textura sutil na fase principal */
#lu-main-phase::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:11;
  background:repeating-linear-gradient(
    180deg,
    transparent 0px,transparent 3px,
    rgba(0,0,0,0.055) 3px,rgba(0,0,0,0.055) 4px
  );
  animation:lu-scan-drift 18s linear infinite;
  mix-blend-mode:multiply;
}
@keyframes lu-scan-drift{
  0%{background-position:0 0;}
  100%{background-position:0 200px;}
}

/* Vignette pulsante cinematográfica — mais dramática */
@keyframes lu-vignette-pulse{
  0%,100%{box-shadow:
    inset 0 0 160px rgba(0,0,0,.75),
    inset 0 0  60px rgba(0,0,0,.45),
    inset 0  80px 80px rgba(0,0,0,.25),
    inset 0 -80px 80px rgba(0,0,0,.25);}
  50%{box-shadow:
    inset 0 0 240px rgba(0,0,0,.92),
    inset 0 0  90px rgba(0,0,0,.60),
    inset 0  100px 100px rgba(0,0,0,.35),
    inset 0 -100px 100px rgba(0,0,0,.35);}
}
#lu-main-phase::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:10;
  animation:lu-vignette-pulse 3.6s ease-in-out infinite;
  border-radius:0;
}

/* Número do nível: pulse de brilho + respiração de filtro */
@keyframes lu-num-breathe{
  0%,100%{filter:brightness(1) saturate(1);}
  50%{filter:brightness(1.18) saturate(1.35) drop-shadow(0 0 20px currentColor);}
}
#lu-level-num{animation:lu-num-breathe 2.8s ease-in-out infinite;}

/* Tag do topo: expansão sutil de spacing */
@keyframes lu-tag-glow{
  0%,100%{opacity:.6;letter-spacing:.3em;}
  50%{opacity:.95;letter-spacing:.38em;}
}
#lu-year-tag{animation:lu-tag-glow 4s ease-in-out infinite;}

/* Botão CTA: shimmer diagonal mais fluido + glow */
@keyframes lu-btn-shimmer{
  0%{background-position:-350% center;}
  100%{background-position:350% center;}
}
#lu-main-btn{
  background-size:350% auto!important;
  animation:lu-btn-shimmer 2.2s linear infinite;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease!important;
  box-shadow:0 4px 20px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)!important;
  letter-spacing:.18em!important;
}
#lu-main-btn:hover{
  transform:scale(1.08) translateY(-2px)!important;
  box-shadow:0 8px 36px rgba(0,0,0,.6),0 0 50px rgba(255,255,255,.15)!important;
}

/* Botão fechar: glass sofisticado */
#lu-share-btn{
  backdrop-filter:blur(14px) saturate(1.6)!important;
  border-color:rgba(255,255,255,.18)!important;
  letter-spacing:.14em!important;
  transition:all .28s cubic-bezier(.34,1.56,.64,1)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 12px rgba(0,0,0,.3)!important;
}
#lu-share-btn:hover{
  transform:scale(1.05) translateY(-1px)!important;
  border-color:rgba(255,255,255,.45)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 20px rgba(0,0,0,.4)!important;
}

/* Perks: flutuação suave escalonada */
@keyframes lu-perk-float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
}
#lu-perks-row span{animation:lu-perk-float 3.8s ease-in-out infinite;}
#lu-perks-row span:nth-child(2){animation-delay:.7s;}
#lu-perks-row span:nth-child(3){animation-delay:1.4s;}
#lu-perks-row span:nth-child(4){animation-delay:2.1s;}

/* Badge "Nível X → Y": pulso de opacidade */
@keyframes lu-badge-soft{
  0%,100%{opacity:1;}
  50%{opacity:.7;}
}
#lu-from-badge{animation:lu-badge-soft 4.5s ease-in-out infinite;}

/* Phrase: shimmer de cor muito sutil */
@keyframes lu-phrase-fade{
  0%,100%{opacity:.83;}
  50%{opacity:.96;}
}
#lu-phrase{animation:lu-phrase-fade 5s ease-in-out infinite;}
/* ADMIN MESSAGE GLOW */
.admin-bubble {
  background: linear-gradient(135deg, rgba(20,70,130,0.97) 0%, rgba(55,130,210,0.92) 100%) !important;
  border: 1px solid rgba(61,139,255,0.65) !important;
  box-shadow: 0 0 14px rgba(61,139,255,0.45), 0 0 32px rgba(61,139,255,0.15), inset 0 1px 0 rgba(255,255,255,0.08) !important;
  color: #fff !important;
}

/* SUPER-ADMIN bubble — mais brilhante e dourado */
.superadmin-bubble {
  background: linear-gradient(135deg, rgba(90,50,0,0.98) 0%, rgba(180,110,0,0.92) 50%, rgba(220,160,0,0.88) 100%) !important;
  border: 1px solid rgba(240,180,0,0.7) !important;
  box-shadow: 0 0 18px rgba(240,165,0,0.55), 0 0 40px rgba(240,165,0,0.2), inset 0 1px 0 rgba(255,255,200,0.12) !important;
  color: #fff !important;
  animation: superPulse 3s ease-in-out infinite;
}
@keyframes superPulse {
  0%,100% { box-shadow: 0 0 18px rgba(240,165,0,0.55), 0 0 40px rgba(240,165,0,0.2); }
  50%      { box-shadow: 0 0 28px rgba(240,165,0,0.8), 0 0 60px rgba(240,165,0,0.35); }
}
.superadmin-tag {
  display: block;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,230,120,0.9);
  margin-bottom: 4px;
}
.admin-tag {
  display: block;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(180,220,255,0.75);
  margin-bottom: 4px;
}

/* PINNED MESSAGE BANNER */
.pinned-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(240,165,0,0.08);
  border-left: 3px solid var(--yellow);
  border-bottom: 1px solid rgba(240,165,0,0.2);
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.pinned-banner:hover { background: rgba(240,165,0,0.14); }
.pinned-banner-icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
.pinned-banner-body { flex: 1; min-width: 0; }
.pinned-banner-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--yellow); margin-bottom: 3px; }
.pinned-banner-text { color: var(--light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pinned-banner-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0 2px; flex-shrink: 0; line-height: 1; }
.pinned-banner-close:hover { color: var(--light); }
.chat-msg.pinned-msg > div > .chat-bubble-wrap > .chat-bubble,
.chat-msg.pinned-msg > div > .chat-bubble { outline: 2px solid rgba(240,165,0,0.5); outline-offset: 2px; border-radius: 8px; }

/* TYPING INDICATOR */
.typing-indicator {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 4px 2px;
  font-size: 0.78rem;
  color: var(--muted);
  min-height: 24px;
}
.typing-dots { display: inline-flex; align-items: center; gap: 3px; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-light); opacity: 0.6;
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-5px);opacity:1;} }

/* PRESENCE BAR */
.presence-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(46,204,143,0.06);
  border: 1px solid rgba(46,204,143,0.18);
  border-radius: 20px;
  min-width: 80px;
}

@media(max-width:768px){
  .presence-bar {
    border-radius: 0;
    border-left: none;
    border-right: none;
    border-top: none;
    padding: 6px 14px;
    gap: 7px;
    font-size: 0.7rem;
  }
}

/* ═══════════════════════════════════════════════
   ✨ GLITTER & SPARKLE EFFECTS ✨
═══════════════════════════════════════════════ */

/* Canvas de partículas — fica atrás de tudo */
#glitter-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
}

/* Garante que conteúdo fique acima do canvas */
#screen-login, #screen-app {
  position: relative;
  z-index: 1;
}

/* Logo sem brilho */

/* Brilho na borda do login card */
.login-card {
  position: relative;
  overflow: visible;
  box-shadow: 0 0 0 1px rgba(61,139,255,0.12), 0 8px 48px rgba(0,0,0,0.4);
  animation: cardAura 4s ease-in-out infinite;
}
@keyframes cardAura {
  0%,100% { box-shadow: 0 0 0 1px rgba(61,139,255,0.12), 0 8px 48px rgba(0,0,0,0.4), 0 0 30px rgba(61,139,255,0.05); }
  50%      { box-shadow: 0 0 0 1px rgba(61,139,255,0.3),  0 8px 48px rgba(0,0,0,0.4), 0 0 60px rgba(61,139,255,0.18); }
}

/* Shimmer no botão de login */
.btn-login {
  position: relative;
  overflow: hidden;
}
.btn-login::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -75%;
  width: 50%;
  height: 200%;
  background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.45) 50%, transparent 80%);
  transform: skewX(-20deg);
  animation: btnShimmer 2.5s ease-in-out infinite;
}
@keyframes btnShimmer {
  0%   { left: -75%; opacity: 0; }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { left: 125%; opacity: 0; }
}

/* Brilho nos stat cards */
.stat-card {
  transition: box-shadow 0.3s, transform 0.3s;
}
.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 24px rgba(61,139,255,0.15);
}
.stat-card.c1:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 28px rgba(61,139,255,0.3); }
.stat-card.c2:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 28px rgba(46,204,143,0.3); }
.stat-card.c3:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 28px rgba(240,165,0,0.3); }
.stat-card.c4:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 28px rgba(167,139,250,0.3); }

/* Sparkle nos level badges */
.level-badge {
  position: relative;
  overflow: hidden;
}
.level-badge::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,0.25) 50%, transparent 75%);
  transform: translateX(-100%);
  animation: badgeShine 3s ease-in-out infinite;
}
@keyframes badgeShine {
  0%   { transform: translateX(-100%); }
  60%  { transform: translateX(100%); }
  100% { transform: translateX(100%); }
}

/* Glow animado nos top-3 do ranking */
.rank-pos.gold   { animation: goldPulse  2.5s ease-in-out infinite; }
.rank-pos.silver { animation: silverPulse 3s ease-in-out infinite; }
.rank-pos.bronze { animation: bronzePulse 3.5s ease-in-out infinite; }
@keyframes goldPulse   { 0%,100%{text-shadow:0 0 4px #fbbf24;} 50%{text-shadow:0 0 14px #ffd700,0 0 28px #fbbf24;} }
@keyframes silverPulse { 0%,100%{text-shadow:0 0 4px #9ca3af;} 50%{text-shadow:0 0 14px #e5e7eb,0 0 24px #9ca3af;} }
@keyframes bronzePulse { 0%,100%{text-shadow:0 0 4px #cd7c35;} 50%{text-shadow:0 0 12px #f59e0b,0 0 22px #cd7c35;} }

/* Brilho na progress bar */
.progress-fill {
  position: relative;
  overflow: hidden;
}
.progress-fill::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  animation: progressShine 2.5s ease-in-out infinite;
}
@keyframes progressShine {
  0%   { left: -60%; }
  100% { left: 160%; }
}

/* Glow no orb do level hero */
.lh-orb {
  animation: orbPulse 2.8s ease-in-out infinite;
}
@keyframes orbPulse {
  0%,100% { box-shadow: 0 0 0 0 transparent; }
  50%     { box-shadow: 0 0 0 10px rgba(255,255,255,0.04), 0 0 24px rgba(255,255,255,0.08); }
}

/* Aurora no topo da sidebar */
.sidebar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-light), var(--l4), var(--l2), transparent);
  animation: sidebarAurora 4s linear infinite;
  background-size: 200% 100%;
}
@keyframes sidebarAurora {
  0%   { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

/* Box hover brilho */
.box {
  transition: box-shadow 0.3s, border-color 0.3s;
}
.box:hover {
  border-color: rgba(61,139,255,0.25);
  box-shadow: 0 4px 24px rgba(61,139,255,0.08);
}

/* Notif com brilho */
.notif.success {
  box-shadow: 0 4px 24px rgba(46,204,143,0.3), 0 0 40px rgba(46,204,143,0.1);
}
.notif.error {
  box-shadow: 0 4px 24px rgba(255,92,92,0.3), 0 0 40px rgba(255,92,92,0.1);
}

/* Stars twinkle na tela de login */
.login-star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: twinkle var(--dur, 2s) ease-in-out infinite var(--delay, 0s);
  pointer-events: none;
}
@keyframes twinkle {
  0%,100% { opacity: 0; transform: scale(0.5); }
  50%     { opacity: 1; transform: scale(1); }
}

/* REPLY BAR (above input) */
.reply-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(61,139,255,0.08);border-left:3px solid var(--accent-light);border-radius:4px 4px 0 0;margin-bottom:-4px;}
.reply-bar-name{font-size:0.72rem;font-weight:700;color:var(--accent-light);margin-bottom:2px;}
.reply-bar-text{font-size:0.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
.reply-bar-close{background:none;border:none;color:var(--muted);font-size:0.9rem;cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1;}
.reply-bar-close:hover{color:var(--light);}

/* QUOTED REPLY inside bubble */
.reply-quote{display:flex;flex-direction:column;background:rgba(0,0,0,0.22);border-left:3px solid rgba(255,255,255,0.35);border-radius:3px;padding:5px 10px;margin-bottom:7px;}
.reply-quote-name{font-size:0.66rem;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:2px;}
.reply-quote-text{font-size:0.74rem;color:rgba(255,255,255,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* CONTEXT MENU */
.msg-ctx-menu{background:var(--dark2);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.5);overflow:hidden;min-width:140px;}
.msg-ctx-menu button{display:block;width:100%;padding:10px 16px;background:none;border:none;color:var(--light);font-size:0.82rem;text-align:left;cursor:pointer;transition:background 0.15s;}
.msg-ctx-menu button:hover{background:rgba(61,139,255,0.15);}
.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:900;height:56px;background:var(--dark2);border-bottom:1px solid var(--border);align-items:center;justify-content:space-between;padding:0 16px;}
.mobile-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-0.02em;}
.mobile-logo span{color:var(--accent-light);}
.hamburger{background:none;border:none;cursor:pointer;width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:8px;transition:background 0.2s;padding:0;}
.hamburger span{display:block;width:22px;height:2px;background:var(--light);border-radius:2px;transition:transform 0.3s ease,opacity 0.3s ease;transform-origin:center;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.sidebar-overlay{display:none;position:fixed;inset:0;z-index:950;background:rgba(0,0,0,0);transition:background 0.3s ease;pointer-events:none;}
.sidebar-overlay.active{display:block;pointer-events:all;background:rgba(0,0,0,0.55);}
@media(max-width:768px){
  .mobile-topbar{display:flex;}
  #screen-app{padding-top:56px;}
  .main-content{height:calc(100vh - 56px);}
  .sidebar{display:flex !important;position:fixed;top:0;left:0;bottom:0;z-index:960;width:280px;height:100vh;transform:translateX(-100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);box-shadow:none;}
  .sidebar.mobile-open{transform:translateX(0);box-shadow:4px 0 32px rgba(0,0,0,0.4);}
  .stats-row{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
  .page{padding:20px 16px;}
  .chat-wrap{height:380px;}
  .modal{max-width:100%;margin:0;border-radius:12px 12px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:90vh;}
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal-wide{max-width:100%;}
  #screen-app.with-banner{padding-top:calc(56px + 40px);}
}

/* ═══════════════════════════════════════════════
   IDENTIDADE EVASTEK — logo branca com detalhe azul
═══════════════════════════════════════════════ */
.ev-logo{display:inline-flex;align-items:flex-start;gap:.14em;font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-0.035em;line-height:1;color:#fff;text-decoration:none;}
.ev-logo .ev-mark{width:.46em;height:.46em;margin-top:.04em;color:var(--accent-light);flex-shrink:0;}
.ev-slogan{font-family:'DM Sans',sans-serif;font-weight:500;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);}
.login-brand{text-align:center;margin-bottom:44px;}
.login-brand .ev-logo{font-size:2.7rem;}
.login-brand .ev-slogan{display:block;font-size:.68rem;margin-top:16px;}
.sidebar-logo .ev-logo{font-size:1.4rem;}
.sidebar-logo .ev-slogan{margin-top:9px;font-size:.52rem;letter-spacing:.2em;}
.mobile-logo.ev-logo{font-size:1.25rem;}
.login-card{animation:none;border-top:1px solid rgba(61,139,255,0.6);box-shadow:0 24px 60px rgba(0,0,0,0.45);}
.btn-login::after{display:none;}
.sidebar::before{background:linear-gradient(90deg,transparent,var(--accent-light),transparent);animation:none;}
#glitter-canvas{opacity:.4;}

/* ═══════════════════════════════════════════════
   ÚLTIMO ACESSO DO CLIENTE (tabela de Clientes)
═══════════════════════════════════════════════ */
.la{display:flex;align-items:center;gap:7px;font-size:0.82rem;font-weight:500;color:var(--light);white-space:nowrap;}
.la-sub{font-size:0.7rem;color:var(--muted);margin-top:2px;white-space:nowrap;}
.la-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(46,204,143,0.18);flex-shrink:0;}
.la-online{color:var(--green);}
.la-muted{color:var(--muted);}
.la-warn{color:var(--yellow);}
.la-cold{color:var(--red);}
.la-none{color:var(--muted);font-weight:400;}
#page-admin-users thead th,#page-admin-users tbody td{padding-left:10px;padding-right:10px;}

.brand-img-full{display:block;width:min(300px,80%);height:auto;margin:0 auto;}
.brand-img-word{display:block;height:auto;}
.sidebar-logo .brand-img-word{width:140px;}
.mobile-logo .brand-img-word{width:104px;}
.sidebar-logo .ev-slogan{color:var(--accent-light);}

/* ═══ Visual sóbrio — sem brilhos, pulsos e glow decorativos ═══ */
#glitter-canvas,.login-star{display:none !important;}
.btn-login::after,.level-badge::before,.progress-fill::after{display:none !important;animation:none !important;}
.rank-pos.gold,.rank-pos.silver,.rank-pos.bronze{animation:none !important;text-shadow:none !important;}
.lh-orb,.superadmin-bubble{animation:none !important;}
.superadmin-bubble{box-shadow:none !important;}
.stat-card:hover,.stat-card.c1:hover,.stat-card.c2:hover,.stat-card.c3:hover,.stat-card.c4:hover{transform:none;box-shadow:none;}
.box:hover{border-color:var(--border);box-shadow:none;}
.notif.success,.notif.error{box-shadow:0 8px 24px rgba(0,0,0,0.4);}

/* ═══ CORREÇÕES MOBILE ═══ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
@media(max-width:768px){
  /* #screen-app criava um "andar" (z-index:1) que deixava a sidebar ATRÁS do fundo escuro: toques caíam no fundo e fechavam o menu */
  #screen-app{z-index:auto;}
  /* iOS dá zoom automático ao tocar em campos com fonte menor que 16px (e o zoom fica depois do login) */
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),select,textarea{font-size:16px !important;}
  .main-content{overflow-x:hidden;max-width:100vw;height:calc(100vh - 56px);height:calc(100dvh - 56px);}
  .sidebar{height:100vh;height:100dvh;}
}
/* ═══ CONTRATO & PAGAMENTO — barra fixa do cliente ═══ */
.contract-bar{position:sticky;top:0;z-index:30;width:100%;background:#0d1626;border-bottom:1px solid rgba(61,139,255,0.28);box-shadow:0 6px 24px rgba(0,0,0,0.35);}
.contract-bar:empty{display:none;}
.cb-main{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;}
.cb-cell{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px 36px;min-width:0;}
.cb-cell + .cb-cell{border-left:1px solid var(--border);}
.cb-label{font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.cb-tiles{display:flex;gap:8px;}
.cb-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:7px 10px 6px;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.cb-num{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;line-height:1.1;color:var(--light);font-variant-numeric:tabular-nums;}
.cb-suf{font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-light);font-weight:600;margin-top:2px;}
.cb-sub{font-size:0.74rem;color:var(--muted);}
.cb-pay{display:flex;align-items:center;gap:12px;}
.cb-pay-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:rgba(61,139,255,0.12);border:1px solid rgba(61,139,255,0.3);flex-shrink:0;}
.cb-pay-main{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;color:var(--light);line-height:1.2;}
.cb-pay.warn .cb-pay-icon{background:rgba(240,165,0,0.14);border-color:rgba(240,165,0,0.45);animation:cbPulse 2s ease-in-out infinite;}
.cb-pay.warn .cb-pay-main{color:var(--yellow);}
.cb-pay.urgent .cb-pay-icon{background:rgba(255,92,92,0.14);border-color:rgba(255,92,92,0.5);animation:cbPulse 1.2s ease-in-out infinite;}
.cb-pay.urgent .cb-pay-main{color:var(--red);}
@keyframes cbPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,165,0,0.35);}50%{box-shadow:0 0 0 7px rgba(240,165,0,0);}}
.cb-progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,0.06);}
.cb-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));}
.cb-alert{display:flex;align-items:center;gap:12px;padding:10px 36px;font-size:0.84rem;line-height:1.4;border-top:1px solid transparent;}
.cb-alert b{font-weight:600;}
.cb-alert.warn{background:rgba(240,165,0,0.12);border-top-color:rgba(240,165,0,0.35);color:#ffd27a;}
.cb-alert.danger{background:rgba(255,92,92,0.16);border-top-color:rgba(255,92,92,0.5);color:#ffb3b3;font-size:0.9rem;}
.cb-alert .cb-alert-ico{font-size:1.15rem;flex-shrink:0;}
.contract-bar.state-danger{border-bottom-color:rgba(255,92,92,0.55);background:#1a0f16;}
.contract-bar.state-danger .cb-tile{border-color:rgba(255,92,92,0.35);background:rgba(255,92,92,0.07);}
.contract-bar.state-danger .cb-suf{color:#ff8a8a;}
.cb-empty{font-size:0.78rem;color:var(--muted);border:1px dashed rgba(240,165,0,0.4);border-radius:4px;margin:10px 36px;padding:8px 12px;}
/* tabela do admin */
.ct-cell{display:flex;flex-direction:column;gap:3px;font-size:0.78rem;line-height:1.35;min-width:170px;}
.ct-cell .ct-main{font-weight:500;}
.ct-cell .ct-meta{font-size:0.7rem;color:var(--muted);}
.ct-chip{display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--border);width:fit-content;}
.ct-chip.ok{color:var(--muted);} .ct-chip.warn{color:var(--yellow);border-color:rgba(240,165,0,0.4);background:rgba(240,165,0,0.08);} .ct-chip.danger{color:var(--red);border-color:rgba(255,92,92,0.45);background:rgba(255,92,92,0.09);}
.ct-actions{display:flex;align-items:center;gap:8px;margin-top:2px;}
.ct-paid-btn{padding:4px 10px !important;font-size:0.66rem !important;}
.ct-undo{font-size:0.66rem;color:var(--muted);text-decoration:underline;cursor:pointer;}
.ct-last{font-size:0.68rem;color:var(--green);}
.act-grid{display:grid;grid-template-columns:repeat(2,minmax(96px,1fr));gap:6px;}
.act-grid .btn{width:100%;justify-content:center;text-align:center;white-space:nowrap;}
@media(max-width:768px){
  .cb-main{grid-template-columns:1fr !important;}
  .cb-cell{padding:8px 14px;gap:4px;}
  .cb-cell + .cb-cell{border-left:none;border-top:1px solid var(--border);}
  .cb-label{font-size:0.56rem;}
  .cb-tiles{gap:6px;} .cb-tile{flex:1;min-width:0;padding:3px 4px 2px;} .cb-num{font-size:1rem;} .cb-suf{font-size:0.5rem;margin-top:1px;}
  .cb-pay-icon{display:none;} .cb-pay-main{font-size:0.9rem;} .cb-sub{font-size:0.68rem;}
  .cb-alert{padding:8px 14px;font-size:0.76rem;gap:8px;} .cb-alert.danger{font-size:0.78rem;}
  .cb-alert .cb-alert-ico{font-size:1rem;}
  .contract-bar.state-danger .cb-main .cb-cell + .cb-cell{display:none;}
  .contract-bar.state-danger .cb-main .cb-cell .cb-sub{display:none;}
  .cb-empty{margin:8px 14px;}
}
}

/* ═══ iPHONE (app na tela inicial) — safe-area, topo e chat ═══ */
:root{--topbar-h:calc(56px + env(safe-area-inset-top, 0px));}
.cb-alert-btn{margin-left:auto;flex-shrink:0;background:rgba(255,255,255,0.14);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:7px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit;}
.cb-alert-btn:active{background:rgba(255,255,255,0.28);}
@media(max-width:768px){
  .mobile-topbar{height:var(--topbar-h);padding-top:env(safe-area-inset-top, 0px);box-sizing:border-box;}
  #screen-app{padding-top:var(--topbar-h);}
  #screen-app.with-banner{padding-top:calc(var(--topbar-h) + 40px);}
  .main-content{height:calc(100vh - var(--topbar-h));height:calc(100dvh - var(--topbar-h));padding-bottom:env(safe-area-inset-bottom, 0px);}
  .sidebar{padding-top:env(safe-area-inset-top, 0px);box-sizing:border-box;}
  .contract-bar{top:0;}
  .cb-alert{flex-wrap:wrap;}
  /* chat ocupa a tela toda */
  #page-client-chat{padding:12px 12px 8px;}
  #page-client-chat .page-header{margin-bottom:10px;}
  #page-client-chat .page-title{font-size:1.25rem;}
  #page-client-chat .page-subtitle{display:none;}
  #page-client-chat .box-header{flex-wrap:wrap;gap:8px;padding:12px 14px;}
  #page-client-chat .presence-bar{max-width:100%;overflow:hidden;flex-wrap:wrap;border-radius:20px;border:1px solid rgba(46,204,143,0.18);}
  #page-client-chat .box-body{padding:12px 14px;}
  #page-client-chat .chat-wrap,.chat-wrap{height:calc(100dvh - var(--topbar-h) - var(--cb-h, 0px) - 175px - env(safe-area-inset-bottom, 0px));min-height:260px;}
}

/* ═══ iPHONE v5 — cronômetro preso logo abaixo do cabeçalho; resto rola normal ═══ */
@media(max-width:768px){
  #screen-app{position:relative !important;z-index:auto !important;width:100%;height:auto !important;min-height:100vh !important;min-height:100dvh !important;overflow:visible;padding-top:var(--tb-bottom, var(--topbar-h)) !important;box-sizing:border-box;}
  #screen-app.with-banner{padding-top:calc(var(--tb-bottom, var(--topbar-h)) + 40px) !important;}
  #screen-app .main-content{position:static !important;height:auto !important;max-width:100% !important;overflow:visible !important;padding-top:0 !important;padding-bottom:env(safe-area-inset-bottom, 0px);}
  .contract-bar{position:sticky !important;top:var(--tb-bottom, var(--topbar-h));z-index:40;}
  #screen-app.with-banner .contract-bar{top:calc(var(--tb-bottom, var(--topbar-h)) + 40px);}
  .mobile-topbar{background:var(--dark2);}
  .cb-alert{flex-wrap:nowrap;align-items:center;}
  .cb-alert > span:nth-child(2){flex:1;min-width:0;}
  .cb-alert-btn{padding:6px 10px;font-size:0.74rem;}
  .chat-wrap{height:calc(100dvh - var(--tb-bottom, var(--topbar-h)) - var(--cb-h, 0px) - 175px - env(safe-area-inset-bottom, 0px));min-height:260px;}
}
</style>

//  MOBILE SIDEBAR
// ══════════════════════════════════
function toggleMobileSidebar() {
  const sidebar  = document.getElementById('sidebar');
  const overlay  = document.getElementById('sidebar-overlay');
  const hamburger = document.getElementById('hamburger-btn');
  const isOpen   = sidebar.classList.contains('mobile-open');
  if (isOpen) {
    closeMobileSidebar();
  } else {
    sidebar.classList.add('mobile-open');
    overlay.classList.add('active');
    hamburger.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
}

function closeMobileSidebar() {
  const sidebar   = document.getElementById('sidebar');
  const overlay   = document.getElementById('sidebar-overlay');
  const hamburger = document.getElementById('hamburger-btn');
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('active');
  if (hamburger) hamburger.classList.remove('open');
  document.body.style.overflow = '';
}

// Swipe-to-open: drag from left edge → open sidebar
(function() {
  let touchStartX = 0, touchStartY = 0, swiping = false;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    swiping = touchStartX < 24; // only trigger from left edge
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!swiping) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    if (dx > 40 && dy < 60) {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('mobile-open')) toggleMobileSidebar();
      swiping = false;
    }
  }, { passive: true });
  // Swipe left on sidebar → close
  let swipeCloseStartX = 0;
  document.getElementById('sidebar') && document.addEventListener('touchstart', e2 => {
    swipeCloseStartX = e2.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - swipeCloseStartX;
    const sidebar = document.getElementById('sidebar');
    if (sidebar && sidebar.classList.contains('mobile-open') && dx < -60) {
      closeMobileSidebar();
    }
  }, { passive: true });
})();

// Close sidebar on ESC key
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileSidebar(); });

function levelName(l)  { return ['','Semente','Raiz','Tronco','Copa'][l]||'—'; }
function levelColor(l) { return ['','#3d8bff','#2ecc8f','#f0a500','#a78bfa'][l]||'#3d8bff'; }
function levelClass(l) { return ['','l1','l2','l3','l4'][l]||'l1'; }
function levelBadge(l) { return `<span class="level-badge badge-${levelClass(l)}">${levelName(l)}</span>`; }

function showNotif(msg, type='success') {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.className = `notif show ${type}`;

function openModal(title, body, footer, wide=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer;
  const box = document.getElementById('modal-box');
  box.className = wide ? 'modal modal-wide' : 'modal';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target.id==='modal-overlay') closeModal(); });

function addAuditEntry(type, icon, action) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const time = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const entry = { id: Date.now(), type, icon, adminName: currentUser?.name||'Sistema', action, time, ts: Date.now() };
  DB.auditLog.unshift(entry);
  fbAddAudit(entry).catch(()=>{});
  const el = document.getElementById('audit-log-body');
  if (el) renderAuditList();
}

// Recalculate progress and points from tasks
function recalcUser(user) {
  if (!user.tasks || !user.tasks.length) { user.progress = 0; return; }
  const done = user.tasks.filter(t=>t.done).length;
  user.progress = Math.round(done / user.tasks.length * 100);
  user.points = user.tasks.filter(t=>t.done).reduce((s,t)=>s+t.points,0);
}

// ══════════════════════════════════
//  CONTRATO & PAGAMENTO (barra fixa do cliente)
// ══════════════════════════════════
const PAY_WARN_DAYS  = 5;  // começa a avisar X dias antes do vencimento
const PAY_GRACE_DAYS = 5;  // prazo máximo (dias) depois do vencimento antes de pausar o trabalho
let _contractTick = null, _contractUnsub = null;

function parseYMD(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function fmtBR(d, opts) { return d.toLocaleDateString('pt-BR', opts || { day: '2-digit', month: '2-digit', year: 'numeric' }); }
function contractEndDate(u) {            // término = fim do dia informado
  const d = parseYMD(u && u.contractEnd);
  if (d) d.setHours(23, 59, 59, 999);
  return d;
}
function cycleKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function dueOfMonth(u, y, m) {           // vencimento do mês (dia 31 → último dia de meses curtos)
  const day = parseInt(u.payDay, 10), last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day, last));
}
function hasPayDay(u) { const d = parseInt(u && u.payDay, 10); return d >= 1 && d <= 31; }
function daysBetween(a, b) {
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate()), B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function isPaid(u, d) { return (u.paidCycles || []).includes(cycleKey(d)); }

// próximo vencimento ainda não pago (hoje ou futuro), dentro do contrato
function nextPaymentDate(u, now) {
  if (!hasPayDay(u)) return null;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), end = contractEndDate(u);
  for (let i = 0; i < 14; i++) {
    const d = dueOfMonth(u, today.getFullYear(), today.getMonth() + i);
    if (d < today) continue;
    if (end && d > end) return null;
    if (isPaid(u, d)) continue;
    return d;
  }
  return null;
}
// vencimento já passado e não pago (só avalia quando o início do contrato está preenchido)
function overduePayment(u, now) {
  const st = parseYMD(u && u.contractStart);
  if (!hasPayDay(u) || !st) return null;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), end = contractEndDate(u);
  for (let i = 0; i < 60; i++) {
    const d = dueOfMonth(u, st.getFullYear(), st.getMonth() + i);
    if (d >= today) break;
    if (d < st) continue;
    if (end && d > end) break;
    if (!isPaid(u, d)) {
      const ge = new Date(d); ge.setDate(ge.getDate() + PAY_GRACE_DAYS); ge.setHours(23, 59, 59, 999);
      return { due: d, graceEnd: ge, late: daysBetween(d, today), paused: now > ge };
    }
  }
  return null;
}
function lastPaidLabel(u) {
  const arr = (u.paidCycles || []).slice().sort();
  if (!arr.length) return '';
  const [y, m] = arr[arr.length - 1].split('-');
  return new Date(+y, +m - 1, 1).toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }).replace('.', '');
}
function payPhrase(n) { return n === 0 ? 'vence hoje' : n === 1 ? 'vence amanhã' : 'faltam ' + n + ' dias'; }

function tilesHTML(ms) {
  const t = Math.max(0, Math.floor(ms / 1000)), pad = n => String(n).padStart(2, '0');
  const parts = [[Math.floor(t / 86400), 'dias'], [pad(Math.floor(t % 86400 / 3600)), 'horas'], [pad(Math.floor(t % 3600 / 60)), 'min'], [pad(t % 60), 'seg']];
  return '<div class="cb-tiles">' + parts.map(p => '<div class="cb-tile"><span class="cb-num">' + p[0] + '</span><span class="cb-suf">' + p[1] + '</span></div>').join('') + '</div>';
}

// devolve { html, danger }
function payAlertKey(u, od) {
  const t = new Date();
  return 'payAlertOk_' + u.id + '_' + od.due.getFullYear() + '-' + (od.due.getMonth() + 1) + '-' + od.due.getDate() + '_' + t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate();
}
function dismissPayAlert() {
  try {
    const od = overduePayment(currentUser, new Date());
    if (od) localStorage.setItem(payAlertKey(currentUser, od), '1');
  } catch (e) {}
  renderContractBar();
}
function contractBarState(u, now) {
  const end = contractEndDate(u);
  const od = overduePayment(u, now);
  if (!end && !od) {
    return { danger: false, html: window._adminUser ? '<div class="cb-empty">⏱ Prazo do contrato ainda não definido para este cliente — configure em Clientes › ✏️ Editar.</div>' : '' };
  }
  // ── após o vencimento: some o prazo do contrato, entra o aviso de pausa ──
  if (od) {
    const dueTxt = fmtBR(od.due), limTxt = fmtBR(od.graceEnd);
    if (!od.paused) {
      let dismissed = false;
      try { dismissed = !!localStorage.getItem(payAlertKey(u, od)); } catch (e) {}
      if (dismissed) {   // depois do "Entendi": só o cronômetro vermelho
        return { danger: true, html:
          '<div class="cb-main"><div class="cb-cell" style="grid-column:1/-1;"><div class="cb-label">⏳ Prazo final para o pagamento</div>' + tilesHTML(od.graceEnd - now) + '</div></div>' };
      }
      return { danger: true, html:
        '<div class="cb-main"><div class="cb-cell"><div class="cb-label">⏳ Prazo final para o pagamento</div>' + tilesHTML(od.graceEnd - now) + '<div class="cb-sub">Até ' + limTxt + '</div></div>' +
        '<div class="cb-cell"><div class="cb-label">💳 Pagamento em atraso</div><div class="cb-pay urgent"><div class="cb-pay-icon">⚠️</div><div><div class="cb-pay-main">Venceu em ' + dueTxt + '</div><div class="cb-sub">há ' + od.late + ' dia' + (od.late === 1 ? '' : 's') + '</div></div></div></div></div>' +
        '<div class="cb-alert danger"><span class="cb-alert-ico">⚠️</span><span>Seu pagamento está em atraso. <b>Se não for realizado até ' + limTxt + ', o trabalho será pausado.</b></span><button type="button" class="cb-alert-btn" onclick="dismissPayAlert()">Entendi</button></div>' };
    }
    return { danger: true, html:
      '<div class="cb-main"><div class="cb-cell" style="grid-column:1/-1;"><div class="cb-label">⛔ Trabalho pausado</div><div class="cb-pay urgent"><div class="cb-pay-icon">⛔</div><div><div class="cb-pay-main">Pagamento não identificado</div><div class="cb-sub">Vencimento em ' + dueTxt + ' · prazo encerrado em ' + limTxt + '</div></div></div></div></div>' +
      '<div class="cb-alert danger"><span class="cb-alert-ico">⛔</span><span><b>O trabalho está pausado por falta de pagamento.</b> Regularize o pagamento para retomarmos as entregas.</span></div>' };
  }
  // ── contrato encerrado ──
  const ms = end - now;
  if (ms <= 0) {
    return { danger: false, html: '<div class="cb-main"><div class="cb-cell" style="grid-column:1/-1;"><div class="cb-label">Contrato</div><div class="cb-pay-main">Encerrado em ' + fmtBR(end) + '</div></div></div>' };
  }
  // ── normal / aviso de pagamento chegando ──
  let pay = '', alert = '';
  const nd = nextPaymentDate(u, now);
  if (nd) {
    const n = daysBetween(now, nd);
    const cls = n <= 1 ? 'urgent' : n <= PAY_WARN_DAYS ? 'warn' : '';
    const wk = fmtBR(nd, { weekday: 'long', day: '2-digit', month: 'long' });
    pay = '<div class="cb-cell"><div class="cb-label">💳 Próximo pagamento</div><div class="cb-pay ' + cls + '"><div class="cb-pay-icon">' + (n <= PAY_WARN_DAYS ? '🔔' : '📅') + '</div>' +
      '<div><div class="cb-pay-main">' + (n === 0 ? 'Vence hoje' : 'Em ' + n + ' dia' + (n === 1 ? '' : 's')) + '</div><div class="cb-sub">' + wk + '</div>' +
      (lastPaidLabel(u) ? '<div class="cb-sub" style="color:var(--green);">✓ Último pago: ' + lastPaidLabel(u) + '</div>' : '') + '</div></div></div>';
    if (n <= PAY_WARN_DAYS) {
      alert = '<div class="cb-alert warn"><span class="cb-alert-ico">🔔</span><span>' + (n === 0
        ? '<b>Hoje é o dia do pagamento</b> (' + wk + ').'
        : 'Seu pagamento vence em <b>' + fmtBR(nd, { day: '2-digit', month: 'long' }) + '</b> (' + wk.split(',')[0] + ') — ' + payPhrase(n) + '. Você tem até essa data para pagar.') + '</span></div>';
    }
  } else if (hasPayDay(u)) {
    pay = '<div class="cb-cell"><div class="cb-label">💳 Pagamento</div><div class="cb-pay-main" style="font-size:0.9rem;">Sem vencimentos até o fim do contrato</div></div>';
  }
  let prog = '';
  const st = parseYMD(u.contractStart);
  if (st && end > st) prog = '<div class="cb-progress"><i style="width:' + Math.max(0, Math.min(100, (now - st) / (end - st) * 100)).toFixed(2) + '%"></i></div>';
  const left = '<div class="cb-cell"><div class="cb-label">⏱ Tempo restante de parceria</div>' + tilesHTML(ms) + '<div class="cb-sub">Até ' + fmtBR(end) + '</div></div>';
  return { danger: false, html: '<div class="cb-main"' + (pay ? '' : ' style="grid-template-columns:1fr;"') + '>' + left + pay + prog + '</div>' + alert };
}

function renderContractBar() {
  const el = document.getElementById('contract-bar');
  if (!el || !currentUser || currentUser.role !== 'client') return;
  const st = contractBarState(currentUser, new Date());
  const numRe = /<span class="cb-num">[^<]*<\/span>/g;
  const sig = st.html.replace(numRe, '<span class="cb-num"></span>');
  if (el._sig !== sig) { el.innerHTML = st.html; el._sig = sig; }
  else {   // só atualiza os números do cronômetro, sem recriar a barra
    const nums = st.html.match(numRe) || [], cells = el.querySelectorAll('.cb-num');
    nums.forEach((n, i) => { const v = n.replace(/<[^>]+>/g, ''); if (cells[i] && cells[i].textContent !== v) cells[i].textContent = v; });
  }
  el.classList.toggle('state-danger', !!st.danger);
  try { document.documentElement.style.setProperty('--cb-h', el.offsetHeight + 'px'); } catch (e) {}
}
function maybeShowPaymentModal() {
  if (!currentUser || window._adminUser) return;
  const od = overduePayment(currentUser, new Date());
  if (!od || !od.paused) return;
  try { if (sessionStorage.getItem('payModal_' + currentUser.id)) return; sessionStorage.setItem('payModal_' + currentUser.id, '1'); } catch (e) {}
  const lim = fmtBR(od.graceEnd);
  openModal(od.paused ? '⛔ Trabalho pausado' : '⚠️ Pagamento em atraso',
    od.paused
      ? '<div style="font-size:0.9rem;line-height:1.6;">O prazo para o pagamento (vencimento em <b>' + fmtBR(od.due) + '</b>) terminou em <b>' + lim + '</b> e o trabalho está <b>pausado</b>. Regularize o pagamento para retomarmos as entregas.</div>'
      : '<div style="font-size:0.9rem;line-height:1.6;">Seu pagamento venceu em <b>' + fmtBR(od.due) + '</b>. <b>Se não for realizado até ' + lim + ', o trabalho será pausado.</b></div>',
    '<button class="btn btn-accent" onclick="closeModal()">Entendi</button>');
}

// mede onde o cabeçalho realmente termina (iPhone/Safari variam) e prende o cronômetro logo abaixo
function syncTopbarOffset() {
  try {
    const tb = document.getElementById('mobile-topbar');
    if (!tb || getComputedStyle(tb).display === 'none') return;
    const b = Math.round(tb.getBoundingClientRect().bottom);
    if (b > 0 && document.documentElement.style.getPropertyValue('--tb-bottom') !== b + 'px') document.documentElement.style.setProperty('--tb-bottom', b + 'px');
  } catch (e) {}
}
window.addEventListener('resize', syncTopbarOffset);
window.addEventListener('orientationchange', syncTopbarOffset);
window.addEventListener('load', syncTopbarOffset);
setInterval(syncTopbarOffset, 500);
function startContractBar() {
  stopContractBar();
  renderContractBar();
  maybeShowPaymentModal();
  _contractTick = setInterval(renderContractBar, 1000);
  try {   // atualiza ao vivo se o admin mudar prazo/pagamento com o cliente online
    _contractUnsub = _db.collection('users').doc(String(currentUser.id)).onSnapshot(snap => {
      const d = snap.data(); if (!d || !currentUser) return;
      const apply = x => { ['contractStart', 'contractEnd', 'payDay'].forEach(k => { x[k] = d[k] || ''; }); x.paidCycles = d.paidCycles || []; };
      apply(currentUser);
      const u = DB.users.find(x => String(x.id) === String(currentUser.id));
      if (u && u !== currentUser) apply(u);
      renderContractBar();
    }, () => {});
  } catch (e) {}
}
function stopContractBar() {
  if (_contractTick) { clearInterval(_contractTick); _contractTick = null; }
  if (_contractUnsub) { try { _contractUnsub(); } catch (e) {} _contractUnsub = null; }
}

// ── tabela do admin ──
function buildContractCell(c) {
  const end = contractEndDate(c), now = new Date(), od = overduePayment(c, now);
  if (!end && !od) return '<span style="font-size:0.72rem;color:var(--muted);">— não definido —</span>';
  let h = '<div class="ct-cell">';
  if (end) {
    const left = end - now > 0 ? daysBetween(now, end) + 1 : null;
    h += left === null
      ? '<div class="ct-main" style="color:var(--red);">Contrato encerrado</div><div class="ct-meta">em ' + fmtBR(end) + '</div>'
      : '<div class="ct-main">' + left + ' dia' + (left === 1 ? '' : 's') + ' restantes</div><div class="ct-meta">até ' + fmtBR(end) + '</div>';
  }
  const nd = nextPaymentDate(c, now);
  if (od) {
    h += '<span class="ct-chip danger">' + (od.paused ? '⛔ Pausado · venceu ' : '⚠️ Atrasado · venceu ') + fmtBR(od.due, { day: '2-digit', month: '2-digit' }) + '</span>';
  } else if (nd) {
    const n = daysBetween(now, nd);
    h += '<span class="ct-chip ' + (n <= 1 ? 'danger' : n <= PAY_WARN_DAYS ? 'warn' : 'ok') + '">💳 ' + fmtBR(nd, { day: '2-digit', month: '2-digit' }) + ' · ' + payPhrase(n) + '</span>';
  }
  if (od || nd) h += '<div class="ct-actions"><button class="btn btn-ghost btn-sm ct-paid-btn" style="color:var(--green);border-color:rgba(46,204,143,0.35);" onclick="markPaid(\'' + c.id + '\')">✅ Marcar pago</button></div>';
  if (lastPaidLabel(c)) h += '<div class="ct-last">✓ Último pago: ' + lastPaidLabel(c) + ' · <span class="ct-undo" onclick="unmarkPaid(\'' + c.id + '\')">desfazer</span></div>';
  return h + '</div>';
}
function refreshContractRow(uid) {
  const u = DB.users.find(x => x.id === uid), acc = document.getElementById('access-' + uid);
  if (u && acc && acc.previousElementSibling) acc.previousElementSibling.innerHTML = buildContractCell(u);
}
function markPaid(uid) {
  const u = DB.users.find(x => x.id === uid); if (!u) return;
  const od = overduePayment(u, new Date()), target = od ? od.due : nextPaymentDate(u, new Date());
  if (!target) return;
  u.paidCycles = Array.from(new Set([...(u.paidCycles || []), cycleKey(target)]));
  fbPatchUser(uid, { paidCycles: u.paidCycles }).catch(() => {});
  addAuditEntry('edit', '💳', 'Marcou pagamento de <b>' + fmtBR(target, { month: 'long', year: 'numeric' }) + '</b> como pago — <b>' + u.name + '</b> (' + u.company + ')');
  showNotif('Pagamento de ' + fmtBR(target, { month: 'long' }) + ' marcado como pago!', 'success');
  refreshContractRow(uid);
}
function unmarkPaid(uid) {
  const u = DB.users.find(x => x.id === uid); if (!u) return;
  const arr = (u.paidCycles || []).slice().sort(); if (!arr.length) return;
  const removed = arr.pop();
  u.paidCycles = arr;
  fbPatchUser(uid, { paidCycles: u.paidCycles }).catch(() => {});
  addAuditEntry('edit', '↩', 'Desfez o pagamento de <b>' + removed + '</b> — <b>' + u.name + '</b> (' + u.company + ')');
  showNotif('Último pagamento desfeito.', 'success');
  refreshContractRow(uid);
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) { showLoginErr('Preencha e-mail e senha.'); return; }

  // Verify Firebase is loaded
  if (typeof firebase === 'undefined' || !_auth) {
    showLoginErr('Sistema ainda carregando. Aguarde 2 segundos e tente novamente.');
    return;
  }

  const btn = document.querySelector('.btn-login');
  if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }

  showFBLoading('Autenticando...');

  _auth.signInWithEmailAndPassword(email, pass)
    .then(async () => {
      showFBLoading('Carregando dados...');
      try {
        await fbSyncUsers();
      } catch(e) {
        hideFBLoading();
        if (btn) { btn.disabled = false; btn.textContent = 'Acessar plataforma'; }
        showLoginErr('Erro ao carregar dados: ' + e.message);
        return;
      }
      await fbSyncAudit().catch(()=>{});
      await fbSyncMessages().catch(()=>{});
      await fbSyncInvestments().catch(()=>{});

      const user = DB.users.find(u => u.email === email);
      if (!user) {
        hideFBLoading();
        if (btn) { btn.disabled = false; btn.textContent = 'Acessar plataforma'; }
        showLoginErr('Usuário não encontrado. Contate o administrador.');
        return;
      }
      if (user.role !== 'admin' && isSuspendedNow(user)) {
        const s = user.suspended;
        let msg = 'Sua conta está suspensa.';
        if (s && s.reason) msg += ' Motivo: ' + s.reason;
        if (s && s.type === 'timed' && s.until) {
          const d = new Date(s.until);
          msg += ' Até: ' + d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        } else if (s && s.type === 'until_unlock') msg += ' Aguarde liberação do administrador.';
        hideFBLoading();
        if (btn) { btn.disabled = false; btn.textContent = 'Acessar plataforma'; }
        showLoginErr(msg);
        return;
      }
      currentUser = user;
      hideFBLoading();
      if (btn) { btn.disabled = false; btn.textContent = 'Acessar plataforma'; }
      document.getElementById('login-err').style.display = 'none';
      document.getElementById('screen-login').classList.remove('active');
      document.getElementById('screen-app').classList.add('active');
      if (user.role === 'client') recordClientLogin(user);
      startActivityTracking();
      buildShell();
      if (user.role === 'client') {
        fbSubscribeChat(user.level, 'chat-messages-client');
        setTimeout(() => checkFirstLoginNewLevel(), 900);
      } else {
        [1,2,3,4].forEach(l => fbSubscribeChat(l, 'chat-messages-admin'));
        startAdminAccessWatch();
      }
    })
    .catch(err => {
      hideFBLoading();
      if (btn) { btn.disabled = false; btn.textContent = 'Acessar plataforma'; }
      const code = err.code || '';
      if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
        showLoginErr('E-mail ou senha incorretos.');
      } else if (code === 'auth/too-many-requests') {
        showLoginErr('Muitas tentativas. Aguarde alguns minutos.');
      } else if (code === 'auth/network-request-failed') {
        showLoginErr('Sem conexão com a internet. Verifique sua rede.');
      } else if (code === 'auth/invalid-api-key') {
        showLoginErr('Erro de configuração do sistema. Contate o suporte.');
      } else {
        showLoginErr('Erro: ' + (err.message || code));
      }
      console.error('Login error:', err.code, err.message);
    });
}
function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display='block';
}

function ni(id,icon,label,badge=false) {
  return `<div class="nav-item" id="nav-${id}" onclick="navigateTo('${id}')">${icon}<span>${label}</span>${badge?'<span class="nav-badge">AO VIVO</span>':''}</div>`;
}
function navigateTo(id) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const navEl=document.getElementById('nav-'+id), pageEl=document.getElementById('page-'+id);
  if(navEl) navEl.classList.add('active');
  if(pageEl) pageEl.classList.add('active');
  currentPage=id;
  if(id==='admin-audit') setTimeout(renderAuditList,30);
  if(id==='admin-overview') setTimeout(refreshAdminOverview,30);
  if(id==='admin-ranking') setTimeout(refreshAdminRanking,30);
  if(id==='client-chat'&&currentUser) {
    _unreadCount = 0; updateUnreadBadge();
    setTimeout(()=>{
      fbSubscribeChat(currentUser.level,'chat-messages-client');
      fbSubscribeTyping(currentUser.level,'chat-messages-client');
      fbSubscribePresence(currentUser.level,'chat-messages-client');
    },50);
  }
  if(id==='admin-chat') {
    _unreadCount = 0; updateUnreadBadge();
    setTimeout(()=>{
      fbSubscribeChat(currentAdminChatLevel,'chat-messages-admin');
      fbSubscribeTyping(currentAdminChatLevel,'chat-messages-admin');
      fbSubscribePresence(null,'chat-messages-admin');
    },50);
  }
  // Auto-close sidebar on mobile after navigation
  if(window.innerWidth<=768) closeMobileSidebar();
}
function exitImpersonation() {
  currentUser=window._adminUser; window._adminUser=null;
  const b=document.getElementById('impersonate-banner'); if(b) b.remove();
  document.getElementById('screen-app').style.paddingTop='';
  document.getElementById('screen-app').classList.remove('with-banner');
  buildShell(); showNotif('Voltou ao painel do administrador.','success');
}

function isSuspendedNow(u) {
  if (!u.suspended) return false;
  if (u.suspended.type==='until_unlock') return true;
  if (u.suspended.type==='timed'&&u.suspended.until) return new Date(u.suspended.until)>new Date();
  return false;
}

  const u = currentUser;

  const fmt = v => 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

  const totalInvested = entries.reduce((s,e) => s + (e.value||0), 0);

  // ROI-eligible entries only

  const totalRoiInvested = roiEntries.reduce((s,e) => s + (e.value||0), 0);
  const totalRoiReturn   = roiEntries.reduce((s,e) => s + (e.roi?.totalReturn||0), 0);

    'Criação de Conteúdo':'#ff6b6b','Consultoria Estratégica':'#06d6a0',

  // Group by service for distribution chart
  const byService = {};
  entries.forEach(e => {
    if (!byService[e.service]) byService[e.service] = 0;
    byService[e.service] += e.value || 0;
  });
  const totalForChart = Object.values(byService).reduce((a,b)=>a+b,0)||1;

  return `<div class="page" id="page-client-investment">

      </div>
      <div class="stat-card c3">
        <div class="stat-card-label">Lucro Líquido</div>
        <div class="stat-card-value" style="font-size:1.4rem;color:${totalRoiReturn-totalRoiInvested>=0&&totalRoiReturn>0?'var(--green)':'var(--muted)'}">
          ${totalRoiReturn>0?(totalRoiReturn-totalRoiInvested>=0?'+':'')+fmt(totalRoiReturn-totalRoiInvested):'—'}
        </div>
        <div class="stat-card-sub">retorno menos investido</div>

    </div>

    <div class="grid-2" style="margin-bottom:20px;">

          ${Object.keys(byService).length === 0

            : Object.entries(byService).map(([svc, val]) => {
                const pct = Math.round(val / totalForChart * 100);
                const color = serviceColors[svc] || '#3d8bff';
                const hasRoi = ROI_SERVICES_CLIENT.includes(svc);
                return `<div style="margin-bottom:14px;">

                    </span>

            : (() => {

                roiEntries.forEach(e => {
                  if (!byROISvc[e.service]) byROISvc[e.service] = { invested:0, returned:0 };
                  byROISvc[e.service].invested += e.value||0;
                  byROISvc[e.service].returned += e.roi?.totalReturn||0;

function checkFirstLoginNewLevel() {
  if (!currentUser || currentUser.role !== 'client') return;
  const seenLevel = (currentUser.levelSeen !== undefined && currentUser.levelSeen !== null) ? currentUser.levelSeen : 0;
  if (currentUser.level <= seenLevel || currentUser.level <= 1) return;
  const newLevel = currentUser.level;
  // Esconde o conteúdo do app — cliente não vê o novo dashboard antes da animação
  const mainContent = document.getElementById('main-content');
  const sidebar = document.getElementById('sidebar');
  if (mainContent) mainContent.style.visibility = 'hidden';
  if (sidebar) sidebar.style.visibility = 'hidden';
  confirmLevelUpFirstLogin(newLevel - 1, newLevel);
}

function confirmLevelUpFirstLogin(oldLevel, newLevel) {
  currentUser.levelSeen = newLevel;
  fbPatchUser(currentUser.id, { levelSeen: newLevel }).catch(() => {});
  closeModal();
  setTimeout(() => showLevelUpCelebration(oldLevel, newLevel), 350);
}

// Reverb sintético de alta qualidade via impulso de ruído filtrado
function _mkReverb(ac, decay) {
  try {
    const sr=ac.sampleRate, len=Math.floor(sr*decay);
    const buf=ac.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.8)*(Math.random()>.5?1:-1);}
    const c=ac.createConvolver(); c.buffer=buf; return c;
  } catch(e){return null;}
}
// Compressor dinâmico — faz os sons soarem "mastered"
function _mkComp(ac) {
  const c=ac.createDynamicsCompressor();
  c.threshold.value=-20; c.knee.value=12; c.ratio.value=5;
  c.attack.value=0.002; c.release.value=0.2;
  c.connect(ac.destination); return c;
}
