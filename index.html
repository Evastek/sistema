function quickLevelUp(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u||u.level>=4){showNotif('Já está no nível máximo!','error');return;}
  const old=u.level; u.level++;
  addAuditEntry('level','⬆️','Avançou <b>'+u.name+'</b> ('+u.company+') de Nível '+old+' para Nível '+u.level);
  fbPatchUser(uid,{level:u.level}).catch(()=>{});
  showNotif(u.name+' avançou para Nível '+u.level+' — '+levelName(u.level)+'!','success');
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
}

function quickLevelDown(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u||u.level<=1){showNotif('Já está no nível mínimo!','error');return;}
  const old=u.level; u.level--;
  addAuditEntry('level','⬇️','Regrediu <b>'+u.name+'</b> ('+u.company+') de Nível '+old+' para Nível '+u.level);
  fbPatchUser(uid,{level:u.level}).catch(()=>{});
  showNotif(u.name+' regrediu para Nível '+u.level+' — '+levelName(u.level)+'.','error');
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
}

// ══════════════════════════════════
//  ✨ GLITTER PARTICLE ENGINE ✨
// ══════════════════════════════════
(function initGlitter() {
  return; // partículas/glitter desativadas (visual mais sóbrio)
  const canvas = document.getElementById('glitter-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Colour palette — blues, purples, golds, teals, whites
  const PALETTE = [
    '#3d8bff','#ffffff','#7dd3fc','#bfdbfe','#f9fafb',
    '#ffffff','#93c5fd','#3d8bff','#e0f2fe','#ffffff'
  ];

  const PARTICLE_COUNT = 90;
  const particles = [];

  class Particle {
    constructor() { this.reset(true); }
    reset(init) {
      this.x     = Math.random() * canvas.width;
      this.y     = init ? Math.random() * canvas.height : canvas.height + 10;
      this.size  = Math.random() * 2.2 + 0.4;
      this.speedX= (Math.random() - 0.5) * 0.45;
      this.speedY= -(Math.random() * 0.6 + 0.15);
      this.alpha = 0;
      this.maxAlpha = Math.random() * 0.7 + 0.25;
      this.alphaDir = 1;
      this.alphaSpeed = Math.random() * 0.012 + 0.004;
      this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      this.twinkle = Math.random() > 0.5; // some twinkle fast
      this.angle  = Math.random() * Math.PI * 2;
      this.angleSpeed = (Math.random() - 0.5) * 0.04;
      this.shape  = Math.random(); // 0-0.5 circle, 0.5-0.75 star, 0.75-1 diamond
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.angle += this.angleSpeed;
      // alpha breath
      this.alpha += this.alphaSpeed * this.alphaDir;
      if (this.alpha >= this.maxAlpha) { this.alpha = this.maxAlpha; this.alphaDir = -1; }
      if (this.alpha <= 0) {
        if (this.y < -10) { this.reset(false); }
        else { this.alphaDir = 1; }
      }
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      if (this.shape < 0.5) {
        // Glowing circle
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 2.5);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      } else if (this.shape < 0.75) {
        // 4-point star sparkle
        const s = this.size * 1.8;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2;
          const r = i % 2 === 0 ? s : s * 0.3;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        // Diamond
        const d = this.size * 1.6;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(0, -d);
        ctx.lineTo(d * 0.55, 0);
        ctx.lineTo(0, d);
        ctx.lineTo(-d * 0.55, 0);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Shooting stars
  const shooters = [];
  class Shooter {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width * 1.3;
      this.y = Math.random() * canvas.height * 0.4;
      this.len = Math.random() * 120 + 60;
      this.speed = Math.random() * 6 + 4;
      this.alpha = 0;
      this.maxAlpha = Math.random() * 0.55 + 0.2;
      this.alive = true;
      this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.4;
      this.dx = Math.cos(this.angle) * this.speed;
      this.dy = Math.sin(this.angle) * this.speed;
      this.fade = false;
    }
    update() {
      this.x += this.dx;
      this.y += this.dy;
      if (!this.fade) {
        this.alpha = Math.min(this.alpha + 0.08, this.maxAlpha);
        if (this.alpha >= this.maxAlpha) this.fade = true;
      } else {
        this.alpha -= 0.03;
        if (this.alpha <= 0) { this.alive = false; }
      }
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      const grad = ctx.createLinearGradient(
        this.x, this.y,
        this.x - this.dx * (this.len / this.speed),
        this.y - this.dy * (this.len / this.speed)
      );
      grad.addColorStop(0, this.color);
      grad.addColorStop(1, 'transparent');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(
        this.x - this.dx * (this.len / this.speed),
        this.y - this.dy * (this.len / this.speed)
      );
      ctx.stroke();
      // Bright head
      ctx.beginPath();
      ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
    }
  }

  // Init particles
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

  // Shooting star timer
  let shootInterval = setInterval(() => {
    if (shooters.length < 3) shooters.push(new Shooter());
  }, 2200);

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) { p.update(); p.draw(); }
    for (let i = shooters.length - 1; i >= 0; i--) {
      shooters[i].update();
      shooters[i].draw();
      if (!shooters[i].alive) shooters.splice(i, 1);
    }
    requestAnimationFrame(animate);
  }
  animate();

  // Burst on click — extra sparkles where user clicks
  document.addEventListener('click', e => {
    const burst = 18;
    for (let i = 0; i < burst; i++) {
      const p = new Particle();
      p.x = e.clientX;
      p.y = e.clientY;
      p.speedX = (Math.random() - 0.5) * 3.5;
      p.speedY = (Math.random() - 0.5) * 3.5 - 1;
      p.size = Math.random() * 2.5 + 0.8;
      p.alpha = 0.9;
      p.maxAlpha = 0.9;
      p.alphaDir = -1;
      p.alphaSpeed = Math.random() * 0.025 + 0.015;
      particles.push(p);
      // Remove extra particles after burst to keep count sane
      if (particles.length > PARTICLE_COUNT + burst) particles.shift();
    }
  });

  // Add twinkling stars to login screen
  function addLoginStars() {
    const loginScreen = document.getElementById('screen-login');
    if (!loginScreen) return;
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.className = 'login-star';
      const size = Math.random() * 3 + 1;
      star.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        --dur: ${(Math.random() * 2 + 1.5).toFixed(1)}s;
        --delay: ${(Math.random() * 3).toFixed(1)}s;
        opacity: 0;
        box-shadow: 0 0 ${size * 2}px ${size}px rgba(61,139,255,0.6);
      `;
      loginScreen.appendChild(star);
    }
  }
  // Wait for DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addLoginStars);
  } else {
    addLoginStars();
  }
})();

function deleteUser(uid) {
  openModal('Remover cliente','<p style="color:var(--muted);font-size:0.9rem;line-height:1.6;">Tem certeza que deseja remover este cliente? Esta ação não pode ser desfeita.</p>',
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="confirmDelete('${uid}')">Remover cliente</button>`);
}

function confirmDelete(uid) {
  const u=DB.users.find(x=>x.id===uid);
  const label=u?u.name+' ('+u.company+')':'#'+uid;
  DB.users.splice(DB.users.findIndex(u=>u.id===uid),1);
  fbRemoveUser(uid).catch(()=>{});
  addAuditEntry('delete','🗑️','Removeu a conta de <b>'+label+'</b>');
  closeModal();
  showNotif('Cliente removido.','error');
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
  const sub=document.getElementById('users-subtitle'); if(sub) sub.textContent=DB.users.filter(u=>u.role==='client').length+' contas cadastradas';
}

function viewCredentials(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  const s=iS();
  openModal('🔑 Credenciais — '+u.company,
    `<div style="margin-bottom:16px;"><div style="font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">E-mail</div>
     <div style="display:flex;gap:8px;"><input type="text" id="cred-email" value="${u.email}" readonly style="${s}cursor:text;"/><button class="btn btn-ghost btn-sm" onclick="copyToClip('cred-email')" style="flex-shrink:0;">Copiar</button></div></div>
     <div style="margin-bottom:16px;">
       <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
         <span style="font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Senha</span>
         <span style="font-size:0.72rem;color:var(--accent-light);cursor:pointer;" onclick="toggleCredPassEdit('${uid}')">✏️ Alterar senha</span>
       </div>
       <div style="display:flex;gap:8px;">
         <input type="text" id="cred-pass" value="${u.pass}" readonly style="${s}cursor:text;font-family:monospace;" placeholder="Nova senha…"/>
         <button class="btn btn-ghost btn-sm" onclick="copyToClip('cred-pass')" style="flex-shrink:0;">Copiar</button>
       </div>
       <div id="cred-pass-actions" style="display:none;margin-top:8px;gap:8px;justify-content:flex-end;">
         <button class="btn btn-ghost btn-sm" onclick="cancelCredPassEdit('${u.pass}')">Cancelar</button>
         <button class="btn btn-accent btn-sm" onclick="saveCredPass('${uid}')">💾 Salvar senha</button>
       </div>
     </div>
     <div style="background:rgba(255,92,92,0.06);border:1px solid rgba(255,92,92,0.2);border-radius:4px;padding:10px 14px;font-size:0.78rem;color:var(--muted);">⚠️ Não compartilhe com terceiros.</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Fechar</button><button class="btn btn-accent" onclick="impersonateUser('${uid}');closeModal();">👁 Entrar como cliente</button>`);
}

function toggleCredPassEdit(uid) {
  const inp = document.getElementById('cred-pass');
  const actions = document.getElementById('cred-pass-actions');
  if (!inp) return;
  inp.readOnly = false;
  inp.style.borderColor = 'var(--accent-light)';
  inp.focus();
  inp.select();
  if (actions) actions.style.display = 'flex';
}

function cancelCredPassEdit(originalPass) {
  const inp = document.getElementById('cred-pass');
  const actions = document.getElementById('cred-pass-actions');
  if (inp) { inp.value = originalPass; inp.readOnly = true; inp.style.borderColor = ''; }
  if (actions) actions.style.display = 'none';
}

function saveCredPass(uid) {
  const inp = document.getElementById('cred-pass');
  if (!inp) return;
  const newPass = inp.value.trim();
  if (!newPass || newPass.length < 4) { showNotif('A senha deve ter ao menos 4 caracteres.', 'error'); inp.focus(); return; }
  const u = DB.users.find(x => x.id === uid);
  if (!u) return;
  u.pass = newPass;
  fbPatchUser(uid, { pass: newPass }).catch(() => {});
  // Atualiza senha no Firebase Auth também
  _auth.currentUser && _auth.currentUser.updatePassword && _auth.currentUser.updatePassword(newPass).catch(() => {});
  addAuditEntry('edit', '🔑', 'Alterou a senha de <b>' + u.name + '</b> (' + u.company + ')');
  inp.readOnly = true;
  inp.style.borderColor = '';
  const actions = document.getElementById('cred-pass-actions');
  if (actions) actions.style.display = 'none';
  showNotif('Senha de ' + u.name + ' atualizada!', 'success');
}

function copyToClip(inputId) {
  const el=document.getElementById(inputId); if(!el) return;
  navigator.clipboard.writeText(el.value).then(()=>showNotif('Copiado!','success')).catch(()=>{el.select();document.execCommand('copy');showNotif('Copiado!','success');});
}

function impersonateUser(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  window._adminUser=currentUser; currentUser=u;
  buildShell(); showNotif('Visualizando como: '+u.name+' ('+u.company+')','success');
}

// ══════════════════════════════════
//  SUSPENSÃO
// ══════════════════════════════════
function openSuspendModal(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  const s=iS();
  _suspOpt='points'; _suspUid=uid;
  openModal('🚫 Suspender — '+u.name,
    `<div style="background:rgba(255,92,92,0.06);border:1px solid rgba(255,92,92,0.2);border-radius:4px;padding:10px 14px;font-size:0.82rem;color:var(--muted);margin-bottom:16px;">⚠️ <b style="color:var(--light);">${u.name}</b> (${u.company}) não conseguirá fazer login enquanto suspenso.</div>
    <div class="field"><label>Motivo da suspensão</label><input type="text" id="susp-reason" placeholder="Ex: Inadimplência..." style="${s}"/></div>
    <div style="margin-top:16px;margin-bottom:6px;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;">Tipo de suspensão</div>
    <div class="suspend-modal-opts">
      <div class="suspend-opt selected" id="sopt-points" onclick="selectSuspOpt('points')"><input type="radio" name="susp-type" value="points" checked/><label><b>Penalidade de pontos</b> — Remove pontos e mantém acesso</label></div>
      <div class="suspend-opt" id="sopt-until_unlock" onclick="selectSuspOpt('until_unlock')"><input type="radio" name="susp-type" value="until_unlock"/><label><b>Bloquear até admin liberar</b> — Impede login até desbloqueio manual</label></div>
      <div class="suspend-opt" id="sopt-timed" onclick="selectSuspOpt('timed')"><input type="radio" name="susp-type" value="timed"/><label><b>Suspensão por tempo</b> — Define data/hora de término</label></div>
    </div>
    <div id="susp-points-config" style="margin-top:12px;"><div class="field"><label>Pontos a remover (atual: ${u.points} pts)</label><input type="number" id="susp-points-val" value="50" min="1" max="${u.points||1}" style="${s}"/></div></div>
    <div id="susp-timed-config" style="display:none;margin-top:12px;"><div class="field"><label>Suspender até (data e hora)</label><input type="datetime-local" id="susp-until" style="${s}" value="${defaultSuspDate()}"/></div></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="applySuspension('${uid}')">🚫 Aplicar suspensão</button>`);
}

function defaultSuspDate() { const d=new Date(); d.setDate(d.getDate()+7); return d.toISOString().slice(0,16); }
let _suspOpt='points', _suspUid=null;
function selectSuspOpt(val) {
  _suspOpt=val;
  ['points','until_unlock','timed'].forEach(o=>{ const el=document.getElementById('sopt-'+o); if(el){el.classList.toggle('selected',o===val); const r=el.querySelector('input[type=radio]'); if(r) r.checked=(o===val);} });
  document.getElementById('susp-points-config').style.display=val==='points'?'block':'none';
  document.getElementById('susp-timed-config').style.display=val==='timed'?'block':'none';
}

function applySuspension(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  const reason=(document.getElementById('susp-reason').value||'').trim();
  if(_suspOpt==='points') {
    const pts=parseInt(document.getElementById('susp-points-val').value)||50;
    const removed=Math.min(pts,u.points);
    u.points=Math.max(0,u.points-removed);
    fbPatchUser(uid,{points:u.points}).catch(()=>{});
    addAuditEntry('suspend','⚡','Aplicou penalidade de <b>-'+removed+' pts</b> a <b>'+u.name+'</b>'+(reason?' — Motivo: '+reason:''));
    closeModal(); showNotif('-'+removed+' pts aplicados a '+u.name,'error');
  } else if(_suspOpt==='until_unlock') {
    u.suspended={type:'until_unlock',reason,suspendedAt:new Date().toISOString(),suspendedBy:currentUser.name};
    fbPatchUser(uid,{suspended:u.suspended}).catch(()=>{});
    addAuditEntry('suspend','🚫','Bloqueou <b>'+u.name+'</b> até desbloqueio manual'+(reason?' — Motivo: '+reason:''));
    closeModal(); showNotif(u.name+' bloqueado até desbloqueio.','error');
  } else if(_suspOpt==='timed') {
    const until=document.getElementById('susp-until').value;
    if(!until){showNotif('Defina a data de término!','error');return;}
    u.suspended={type:'timed',reason,until:new Date(until).toISOString(),suspendedBy:currentUser.name};
    fbPatchUser(uid,{suspended:u.suspended}).catch(()=>{});
    const dStr=new Date(until).toLocaleDateString('pt-BR');
    addAuditEntry('suspend','⏳','Suspendeu <b>'+u.name+'</b> até '+dStr+(reason?' — Motivo: '+reason:''));
    closeModal(); showNotif(u.name+' suspenso até '+dStr+'.','error');
  }
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
}

function unsuspendUser(uid) {
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  u.suspended=null;
  fbPatchUser(uid,{suspended:null}).catch(()=>{});
  addAuditEntry('unsuspend','🔓','Desbloqueou a conta de <b>'+u.name+'</b> ('+u.company+')');
  showNotif(u.name+' desbloqueado!','success');
  const tbody=document.getElementById('admin-users-tbody'); if(tbody) tbody.innerHTML=DB.users.filter(u=>u.role==='client').map(buildUserRow).join('');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
